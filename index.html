<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dashboard OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Dark / Light Mode Colors */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        body.light-mode { background-color: #f1f5f9; color: #0f172a; }
        
        .dark-mode .card { background-color: #1e293b; border: 1px solid #334155; }
        .light-mode .card { background-color: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Circular Progress */
        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Theater Mode Layout Adjustments */
        body.theater-mode #dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }
        
        body.theater-mode #col-media {
            grid-column: 1 / -1;
            grid-row: 1;
            height: 75vh; 
        }
        
        body.theater-mode #col-left,
        body.theater-mode #col-mid {
            display: contents; /* Ungroup columns */
        }

        body.theater-mode #clock-card { grid-column: 1; grid-row: 2; height: 100%; }
        body.theater-mode #weather-card { grid-column: 2; grid-row: 2; height: 100%; }
        body.theater-mode #ev-timer-card { grid-column: 3; grid-row: 2; height: 100%; }
        
        /* Hide non-essentials in theater mode */
        body.theater-mode #calendar-card,
        body.theater-mode #forecast-10day,
        body.theater-mode #controls-card {
            display: none !important; 
        }
        
        /* Close button for Theater Mode */
        #theater-close { display: none; }
        body.theater-mode #theater-close {
            display: flex;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
        }
    </style>
</head>
<body class="dark-mode h-screen w-screen overflow-hidden p-4 box-border relative">

    <!-- Theater Mode Close Button -->
    <button id="theater-close" class="bg-red-500 hover:bg-red-600 text-white rounded-full w-12 h-12 items-center justify-center shadow-lg transition-transform hover:scale-105 cursor-pointer" onclick="toggleTheaterMode()">
        <i class="fas fa-times text-2xl"></i>
    </button>

    <div id="dashboard-grid" class="grid grid-cols-3 gap-4 h-full w-full">
        
        <!-- COLUMN 1: Clock & Weather -->
        <div id="col-left" class="flex flex-col gap-4 h-full">
            <!-- Clock -->
            <div id="clock-card" class="card rounded-3xl p-6 flex flex-col justify-center items-center h-1/3">
                <div class="text-7xl font-bold tracking-tighter" id="time-display">00<span class="text-blue-500">:</span>00</div>
                <div class="text-sm font-semibold text-slate-400 mt-2 uppercase tracking-widest" id="date-display">LOADING...</div>
            </div>
            
            <!-- Weather -->
            <div id="weather-card" class="card rounded-3xl p-6 flex flex-col h-2/3">
                <div class="text-xs font-bold text-slate-400 mb-4 uppercase"><i class="fas fa-cloud-sun mr-2 text-blue-400"></i> Local Weather</div>
                <div class="flex-grow flex flex-col items-center justify-center">
                    <i class="fas fa-cloud-showers-heavy text-5xl text-blue-300 mb-2"></i>
                    <div class="text-5xl font-bold mb-1">27<span class="text-2xl text-slate-400">°C</span></div>
                    <div class="text-sm font-semibold text-blue-400 uppercase">Updated</div>
                    <div class="text-xs text-slate-500 mt-1"><i class="fas fa-map-marker-alt"></i> Binh Xuyen, Phu Tho</div>
                </div>
                
                <!-- 10-Day Forecast -->
                <div id="forecast-10day" class="mt-4">
                    <div class="text-[10px] font-bold text-slate-500 mb-2 uppercase">10-Day Forecast</div>
                    <div class="grid grid-cols-5 gap-2" id="forecast-grid"></div>
                </div>
            </div>
        </div>

        <!-- COLUMN 2: EV Timer & Lunar Calendar -->
        <div id="col-mid" class="flex flex-col gap-4 h-full">
            <!-- EV Timer -->
            <div id="ev-timer-card" class="card rounded-3xl p-6 flex flex-col h-1/2 relative">
                <div class="flex justify-between items-center mb-2">
                    <div class="text-xs font-bold text-slate-400 uppercase"><i class="fas fa-charging-station mr-2 text-emerald-400"></i> EV Timer</div>
                    <div class="text-[10px] bg-slate-700 text-slate-300 px-2 py-1 rounded font-bold transition-colors" id="timer-status">READY</div>
                </div>
                
                <div class="flex-grow flex items-center justify-center relative my-2">
                    <svg class="w-40 h-40 transform -rotate-90">
                        <circle cx="80" cy="80" r="70" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-700" />
                        <circle id="timer-ring" cx="80" cy="80" r="70" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="440" stroke-dashoffset="0" class="text-blue-500 progress-ring__circle" />
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-3xl font-bold tracking-tight" id="countdown-display">00:00:00</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button class="bg-slate-700 hover:bg-slate-600 rounded-lg py-2 text-xs font-bold transition-colors" onclick="addTime(15)">+15m</button>
                    <button class="bg-slate-700 hover:bg-slate-600 rounded-lg py-2 text-xs font-bold transition-colors" onclick="addTime(30)">+30m</button>
                    <button class="bg-slate-700 hover:bg-slate-600 rounded-lg py-2 text-xs font-bold transition-colors" onclick="addTime(60)">+1h</button>
                    <button class="bg-slate-800 hover:bg-red-800 text-red-400 rounded-lg py-2 text-xs font-bold transition-colors border border-red-900/50" onclick="resetTimer()">Reset</button>
                </div>
                <!-- Action Button handled by JS -->
                <button id="start-timer-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 font-bold transition-all shadow-lg shadow-blue-500/20" onclick="toggleTimer()">
                    <i class="fas fa-play mr-2"></i> START CHARGING
                </button>
            </div>
            
            <!-- Lunar Calendar -->
            <div id="calendar-card" class="card rounded-3xl p-4 flex flex-col h-1/2">
                <div class="flex justify-between items-center bg-slate-800/50 rounded-xl p-2 mb-3">
                    <button class="w-8 h-8 rounded bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors"><i class="fas fa-chevron-left text-xs"></i></button>
                    <div class="text-sm font-bold tracking-widest whitespace-nowrap" id="cal-month-year">THÁNG 10 / 2026</div>
                    <button class="w-8 h-8 rounded bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors"><i class="fas fa-chevron-right text-xs"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center mb-1">
                    <div class="text-[9px] font-bold text-red-400">CN</div>
                    <div class="text-[9px] font-bold text-slate-400">T2</div>
                    <div class="text-[9px] font-bold text-slate-400">T3</div>
                    <div class="text-[9px] font-bold text-slate-400">T4</div>
                    <div class="text-[9px] font-bold text-slate-400">T5</div>
                    <div class="text-[9px] font-bold text-slate-400">T6</div>
                    <div class="text-[9px] font-bold text-blue-400">T7</div>
                </div>
                <div class="grid grid-cols-7 gap-1 flex-grow content-start">
                    <!-- Demo Calendar Cells -->
                    <div class="aspect-square flex flex-col items-center justify-center rounded-lg bg-slate-800/30"><span class="text-xs font-bold">1</span><span class="text-[8px] text-slate-500">21</span></div>
                    <div class="aspect-square flex flex-col items-center justify-center rounded-lg bg-slate-800/30"><span class="text-xs font-bold">2</span><span class="text-[8px] text-slate-500">22</span></div>
                    <div class="aspect-square flex flex-col items-center justify-center rounded-lg bg-blue-600 text-white shadow-lg shadow-blue-500/30"><span class="text-xs font-bold">9</span><span class="text-[8px] text-blue-200">29</span></div>
                    <script>
                        for(let i=4; i<=28; i++) {
                            document.write(`
                            <div class="aspect-square flex flex-col items-center justify-center rounded-lg bg-slate-800/30">
                                <span class="text-xs font-bold">${i+6 > 31 ? (i+6)-31 : i+6}</span>
                                <span class="text-[8px] text-slate-500">${i}</span>
                            </div>`);
                        }
                    </script>
                </div>
            </div>
        </div>

        <!-- COLUMN 3: YouTube & Controls -->
        <div id="col-media" class="flex flex-col gap-3 h-full">
            <div id="youtube-card" class="card rounded-3xl flex flex-col overflow-hidden flex-grow relative">
                <!-- Thanh tìm kiếm YouTube -->
                <div id="media-header" class="p-3 bg-slate-800 flex items-center justify-between gap-3 z-10 pr-16">
                    <div class="hidden sm:flex items-center gap-2 text-xs font-bold text-slate-400 uppercase">
                        <i class="fab fa-youtube text-red-500 text-lg"></i> Media
                    </div>
                    <div class="flex flex-1 items-center bg-slate-900 rounded-full px-4 py-2 border border-slate-700 focus-within:border-blue-500 transition-colors">
                        <input type="text" id="yt-search-input" placeholder="Tìm bài hát (ví dụ: lofi chill)..." class="bg-transparent border-none outline-none text-sm text-white w-full" onkeypress="if(event.key === 'Enter') searchYoutube()">
                        <button onclick="searchYoutube()" class="text-slate-400 hover:text-white cursor-pointer ml-2">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex-grow w-full relative bg-black">
                    <!-- Standard Iframe -->
                    <iframe 
                        id="yt-player" 
                        class="absolute top-0 left-0 w-full h-full border-0" 
                        src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1&controls=1" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <!-- Compact Controls -->
            <div id="controls-card" class="card rounded-2xl p-2 flex gap-2 h-12 shrink-0">
                <button onclick="toggleTheme()" class="flex-1 bg-slate-700/50 hover:bg-slate-600 rounded-xl flex flex-row items-center justify-center transition-colors border border-slate-600/50 gap-2">
                    <i class="fas fa-adjust text-sm text-yellow-400"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300">Theme</span>
                </button>
                <button onclick="toggleTheaterMode()" class="flex-1 bg-slate-700/50 hover:bg-blue-600/50 hover:border-blue-500/50 rounded-xl flex flex-row items-center justify-center transition-colors border border-slate-600/50 gap-2">
                    <i class="fas fa-expand text-sm text-blue-400"></i>
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-300">Expand</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- YouTube Search Logic ---
        function searchYoutube() {
            const query = document.getElementById('yt-search-input').value;
            if (!query) return;
            const iframe = document.getElementById('yt-player');
            iframe.src = 'https://www.youtube.com/embed?listType=search&list=' + encodeURIComponent(query) + '&autoplay=1';
        }

        // --- Clock & Date Logic ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').innerHTML = `${hours}<span class="text-blue-500">:</span>${minutes}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Theater Mode Logic ---
        function toggleTheaterMode() {
            document.body.classList.toggle('theater-mode');
        }

        // --- Theme Toggle Logic ---
        function toggleTheme() {
            if (document.body.classList.contains('dark-mode')) {
                document.body.classList.replace('dark-mode', 'light-mode');
            } else {
                document.body.classList.replace('light-mode', 'dark-mode');
            }
        }

        // --- Web Audio API Beep System ---
        let audioCtx = null;
        let alarmInterval = null;

        function playBeep() {
            // Khởi tạo AudioContext nếu chưa có (cần tương tác người dùng trước đó)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine'; // Âm thanh Beep điện tử
            osc.frequency.setValueAtTime(800, audioCtx.currentTime); // Tần số 800Hz
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            osc.start();
            
            // Tắt âm dần trong 0.5s
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function triggerAlarm() {
            // Phát tiếng bíp ngay lập tức, sau đó lặp lại mỗi giây
            playBeep();
            alarmInterval = setInterval(playBeep, 1000);

            // Cập nhật giao diện nút
            const btn = document.getElementById('start-timer-btn');
            btn.innerHTML = '<i class="fas fa-bell"></i> STOP ALARM';
            btn.className = "w-full bg-red-600 hover:bg-red-500 text-white rounded-xl py-3 font-bold transition-all shadow-lg shadow-red-500/20 animate-bounce";
            btn.onclick = stopAlarm; // Thay đổi sự kiện onclick
            
            // Đổi màu vòng đếm sang đỏ
            document.getElementById('timer-ring').classList.replace('text-blue-500', 'text-red-500');
            document.getElementById('countdown-display').classList.add('text-red-500');
            
            const status = document.getElementById('timer-status');
            status.innerText = "COMPLETE!";
            status.className = "text-[10px] bg-red-600/30 text-red-500 px-2 py-1 rounded font-bold animate-pulse";
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            
            // Trả lại màu sắc
            document.getElementById('timer-ring').classList.replace('text-red-500', 'text-blue-500');
            document.getElementById('countdown-display').classList.remove('text-red-500');

            // Reset toàn bộ
            resetTimer();
            
            // Phục hồi nút bấm
            const btn = document.getElementById('start-timer-btn');
            btn.className = "w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 font-bold transition-all shadow-lg shadow-blue-500/20";
            btn.innerHTML = '<i class="fas fa-play mr-2"></i> START CHARGING';
            btn.onclick = toggleTimer;
        }


        // --- EV Timer Logic ---
        let timerSeconds = 0;
        let timerInterval = null;
        const FULL_DASH = 440; 
        const ring = document.getElementById('timer-ring');
        
        function formatTime(totalSeconds) {
            const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function updateTimerDisplay() {
            document.getElementById('countdown-display').innerText = formatTime(timerSeconds);
            const maxDemoTime = 7200; 
            const progress = timerSeconds > 0 ? (timerSeconds / maxDemoTime) : 0;
            const offset = FULL_DASH - (progress * FULL_DASH);
            ring.style.strokeDashoffset = Math.max(0, offset);
        }

        function addTime(minutes) {
            timerSeconds += minutes * 60;
            updateTimerDisplay();
            document.getElementById('timer-status').innerText = "SET";
        }

        function resetTimer() {
            if(timerInterval) clearInterval(timerInterval);
            if(alarmInterval) clearInterval(alarmInterval);
            
            timerInterval = null;
            timerSeconds = 0;
            updateTimerDisplay();
            
            document.getElementById('timer-status').innerText = "READY";
            document.getElementById('timer-status').className = "text-[10px] bg-slate-700 text-slate-300 px-2 py-1 rounded font-bold transition-colors";
            
            const btn = document.getElementById('start-timer-btn');
            btn.innerHTML = '<i class="fas fa-play mr-2"></i> START CHARGING';
            btn.className = "w-full bg-blue-600 hover:bg-blue-500 text-white rounded-xl py-3 font-bold transition-all shadow-lg shadow-blue-500/20";
            btn.onclick = toggleTimer;
            
            document.getElementById('timer-ring').classList.replace('text-red-500', 'text-blue-500');
            document.getElementById('countdown-display').classList.remove('text-red-500');
        }

        function toggleTimer() {
            const btn = document.getElementById('start-timer-btn');
            const status = document.getElementById('timer-status');
            
            if (timerInterval) {
                // Pause
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerHTML = '<i class="fas fa-play mr-2"></i> RESUME CHARGING';
                btn.className = "w-full bg-orange-500 hover:bg-orange-600 text-white rounded-xl py-3 font-bold transition-all shadow-lg shadow-orange-500/20";
                status.innerText = "PAUSED";
                status.className = "text-[10px] bg-yellow-600/30 text-yellow-400 px-2 py-1 rounded font-bold";
            } else {
                // Start
                if (timerSeconds <= 0) return; 
                
                // Khởi tạo AudioContext từ tương tác người dùng
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                btn.innerHTML = '<i class="fas fa-pause mr-2"></i> PAUSE CHARGING';
                btn.className = "w-full bg-orange-500 hover:bg-orange-600 text-white rounded-xl py-3 font-bold transition-all shadow-lg shadow-orange-500/20";
                status.innerText = "CHARGING...";
                status.className = "text-[10px] bg-blue-600/30 text-blue-400 px-2 py-1 rounded font-bold animate-pulse";
                
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    }
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        triggerAlarm();
                    }
                }, 1000);
            }
        }

        // --- Mock 10-Day Forecast Data ---
        const forecastGrid = document.getElementById('forecast-grid');
        const days = ['TODAY', 'SAT', 'SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
        const icons = ['fa-cloud-showers-heavy', 'fa-bolt', 'fa-bolt', 'fa-bolt', 'fa-bolt', 'fa-cloud-showers-heavy', 'fa-bolt', 'fa-cloud-rain', 'fa-cloud', 'fa-bolt'];
        const dates = ['9/10', '10/10', '11/10', '12/10', '13/10', '14/10', '15/10', '16/10', '17/10', '18/10'];
        
        let forecastHTML = '';
        for(let i = 0; i < 10; i++) {
            forecastHTML += `
                <div class="bg-slate-800/40 rounded-lg p-1.5 flex flex-col items-center justify-center border border-slate-700/50">
                    <span class="text-[9px] font-bold">${days[i]}</span>
                    <span class="text-[7px] text-slate-500 mb-1">${dates[i]}</span>
                    <i class="fas ${icons[i]} text-sm ${icons[i].includes('bolt') ? 'text-yellow-400' : 'text-blue-400'} mb-1"></i>
                    <div class="text-[8px] font-bold">31° <span class="text-slate-500 font-normal">24°</span></div>
                </div>
            `;
        }
        forecastGrid.innerHTML = forecastHTML;
    </script>
</body>
</html>
