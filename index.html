<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Car Dash</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg1:#4facfe; --bg2:#00c6fb;
  --panel:rgba(0,0,0,.30); --panel2:rgba(255,255,255,.12);
  --text:#fff; --muted:rgba(255,255,255,.7); --accent:#ffd54a;
}
body[data-sky=clear-day]{--bg1:#2f80ed;--bg2:#56ccf2}
body[data-sky=clear-night]{--bg1:#0f2027;--bg2:#2c5364}
body[data-sky=cloud-day]{--bg1:#5b6b85;--bg2:#9fb0c6}
body[data-sky=cloud-night]{--bg1:#1c1e22;--bg2:#3d4147}
body[data-sky=rain]{--bg1:#2b3a4b;--bg2:#4b6076}
body[data-sky=storm]{--bg1:#12122a;--bg2:#2a2f55}
body[data-sky=fog]{--bg1:#5f6f7a;--bg2:#a9b6bf}
body[data-sky=snow]{--bg1:#6f93c4;--bg2:#b7d3ee}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  transition:background 1s;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);
}
button,input{font:inherit;color:inherit}
button{
  background:var(--panel2);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  padding:7px 11px;cursor:pointer;white-space:nowrap;
}
button:active{transform:scale(.97)}
button.on{background:var(--accent);color:#222;border-color:var(--accent);font-weight:600}
input{
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:10px;
  padding:7px 10px;min-width:0;flex:1;outline:none;
}
input::placeholder{color:var(--muted)}

/* thanh trên */
#bar{display:flex;gap:6px;padding:8px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar .sp{flex:1}

/* khu vực chính */
#stage{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px calc(8px + env(safe-area-inset-bottom));flex-direction:row}
@media (max-aspect-ratio:1/1){#stage{flex-direction:column}}
#stage[data-layout=row]{flex-direction:row!important}
#stage[data-layout=col]{flex-direction:column!important}

.panel{
  flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border-radius:16px;padding:8px;gap:8px;overflow:hidden;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#p-yt,#p-map{flex-grow:2}
.panel.hide{display:none}
/* cột phụ: đồng hồ + thời tiết chia đôi nhau */
#side{flex:1 1 0;min-width:0;min-height:0;display:flex;gap:8px;flex-direction:column}
#side.hide{display:none}
@media (max-aspect-ratio:1/1){#side{flex-direction:row}}
#stage[data-layout=row] #side{flex-direction:column!important}
#stage[data-layout=col] #side{flex-direction:row!important}
#p-yt.hide{display:flex;position:fixed;left:-9999px;top:0;width:320px;height:300px}
.row{display:flex;gap:6px;align-items:center}
.title{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* youtube */
.player-wrap{flex:1;min-height:110px;border-radius:12px;overflow:hidden;background:#000;position:relative}
.player-wrap video{width:100%;height:100%;border:0;background:#000;outline:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
#ytMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:14px;line-height:1.5;background:rgba(0,0,0,.82);z-index:2;flex-direction:column;gap:8px}
#ytMsg a{color:var(--accent)}
/* trang chủ YouTube (lưới bài hát bấm là phát) */
#home{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:8px;padding:10px;background:#0b121c;overflow:auto;text-align:left}
#home.open{display:flex}
#home h4{margin:8px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
#home .hint{font-size:13px;color:var(--muted);line-height:1.5}
#homeTop{display:flex;gap:6px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{cursor:pointer;background:var(--panel2);border-radius:10px;overflow:hidden;font-size:12px;line-height:1.3}
.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.tile div{padding:6px 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.cur{outline:2px solid var(--accent)}
#ytList{display:none}
#p-yt{container-type:inline-size}
.yt-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.yt-main .player-wrap{flex:1;min-height:110px}
#queue{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
#queue:empty{display:none}
#queue .tile{flex:0 0 128px}
@container (min-width:640px){
  .yt-main{flex-direction:row}
  #queue{flex-direction:column;overflow-x:hidden;overflow-y:auto;width:230px}
  #queue .tile{flex:0 0 auto;display:flex;gap:8px;align-items:center}
  #queue .tile img{width:96px;flex:0 0 96px}
  #queue .tile div{padding:4px 4px 4px 0;-webkit-line-clamp:3}
}
.item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:13px}
.item.cur{outline:2px solid var(--accent)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.item button{padding:2px 8px}
.res{display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px;border-radius:8px;background:var(--panel2);font-size:13px}
.res img{width:64px;height:36px;object-fit:cover;border-radius:6px}
#ytResults{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#ytResults:empty{display:none}

/* map */
.map-wrap{flex:1;min-height:110px;border-radius:16px;overflow:hidden;background:#222;position:relative}
#map{position:absolute;inset:0;touch-action:none}
.leaflet-container{font:inherit;background:#222}
.leaflet-control-zoom a{width:42px!important;height:42px!important;line-height:42px!important;font-size:24px!important}

/* đồng hồ */
#p-clock{align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;container-type:size}
#clockMode{position:absolute;top:8px;right:8px;z-index:2}
#analog{display:none;width:min(80cqw,52cqh,340px);aspect-ratio:1;flex:0 1 auto;min-height:0}
#p-clock[data-mode=analog] #time{display:none}
#p-clock[data-mode=analog] #analog{display:block}
#analog .face{fill:rgba(0,0,0,.25);stroke:rgba(255,255,255,.6);stroke-width:2}
#analog .tick{stroke:rgba(255,255,255,.6);stroke-width:1}
#analog .tick.h{stroke:#fff;stroke-width:2.5}
#analog text{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
#analog .hand{stroke:#fff;stroke-linecap:round}
#analog .sec{stroke:var(--accent);stroke-width:1.5}
#time{font-size:min(17cqw,22cqh,110px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#time small{font-size:.35em;font-weight:500;margin-left:.15em;color:var(--muted)}
#date{font-size:clamp(14px,2.6vh,22px);color:var(--muted);margin-top:6px}
#lunar{margin-top:10px;font-size:clamp(14px,2.6vh,22px);background:var(--panel2);border-radius:12px;padding:8px 14px;line-height:1.5}
#lunar b{color:var(--accent);font-size:1.25em}
#lunar small{display:block;color:var(--muted);font-size:.8em}

/* thời tiết */
#p-weather{overflow:auto}
.w-top{display:flex;align-items:center;gap:10px}
.w-ico{font-size:clamp(44px,9vh,72px);line-height:1}
.w-temp{font-size:clamp(36px,7vh,60px);font-weight:700;line-height:1}
.w-desc{color:var(--muted);font-size:14px}
.w-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cell{flex:0 0 auto;min-width:56px;text-align:center;background:var(--panel2);border-radius:10px;padding:6px 4px;font-size:12px}
.cell b{display:block;font-size:14px}
.cell .e{font-size:20px}
#locRow{display:none;flex-direction:column;gap:6px}
#locRes{display:flex;flex-direction:column;gap:4px}
#locRes button{text-align:left}
#wLoc{background:none;border:0;padding:0;font-weight:600;font-size:15px;text-align:left}

/* hiệu ứng mưa / tuyết */
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1s}
#fx.rain{opacity:.5;background-image:linear-gradient(105deg,transparent 48%,rgba(255,255,255,.55) 50%,transparent 52%);background-size:26px 90px;animation:rain .45s linear infinite}
#fx.snow{opacity:.7;background-image:radial-gradient(circle,#fff 2px,transparent 3px);background-size:48px 48px;animation:snow 5s linear infinite}
@keyframes rain{to{background-position:-26px 90px}}
@keyframes snow{to{background-position:20px 48px}}
#toast{position:fixed;left:50%;top:64px;max-width:90vw;text-align:center;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 14px;border-radius:10px;font-size:13px;z-index:10;display:none}
.yctl{flex-wrap:wrap}
.yctl input{flex:1 1 150px}
@media (pointer:coarse){
  button{min-height:46px;padding:9px 14px;font-size:16px}
  input{min-height:46px;font-size:16px}
  .tile{font-size:14px}
  #home .chips button{min-height:54px;font-size:17px;flex:1 1 140px}
}
#gwrap{position:absolute;inset:0}
.gframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chgpin{font-size:18px;text-align:center;line-height:30px;background:#2e7d32;border:2px solid #fff;border-radius:50%;color:#fff}
#ytMsg{color:#fff}
/* bản đồ Google ban đêm: đảo màu bản đồ cho dịu mắt */
body[data-theme=dark] #gwrap:not(.sat) .gframe{filter:invert(.92) hue-rotate(180deg) contrast(.92)}
/* giao diện SÁNG */
body[data-theme=light]{--bg1:#cfe6ff;--bg2:#f4f9ff;--panel:rgba(255,255,255,.74);--panel2:rgba(0,0,0,.07);--text:#12202f;--muted:rgba(18,32,47,.62);--accent:#ffb300}
body[data-theme=light][data-sky=rain],body[data-theme=light][data-sky=storm]{--bg1:#c3cedb;--bg2:#e9eef4}
body[data-theme=light][data-sky=fog],body[data-theme=light][data-sky=cloud-day],body[data-theme=light][data-sky=cloud-night]{--bg1:#d5dce6;--bg2:#f1f4f8}
body[data-theme=light] button{border-color:rgba(0,0,0,.16)}
body[data-theme=light] button.on{color:#1d1400}
body[data-theme=light] input{background:rgba(255,255,255,.95);border-color:rgba(0,0,0,.2)}
body[data-theme=light] #home{background:#f3f7fb}
body[data-theme=light] #analog .face{fill:rgba(255,255,255,.55);stroke:rgba(0,0,0,.45)}
body[data-theme=light] #analog .tick{stroke:rgba(0,0,0,.4)}
body[data-theme=light] #analog .tick.h{stroke:#12202f}
body[data-theme=light] #analog text{fill:#12202f}
body[data-theme=light] #analog .hand{stroke:#12202f}
body[data-theme=light] #analog .sec{stroke:#e65100}
body[data-theme=light] #lunar b{color:#a35d00}
#p-map{padding:0;gap:0}
#mTop{position:absolute;left:10px;right:10px;top:10px;z-index:1100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#mTop>*{pointer-events:auto}
#mSearch{display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;background:#fff;color:#202124;border-radius:26px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#mSearch input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font-size:17px;min-height:0;padding:0 4px;border-radius:0;outline:none}
#mSearch input::placeholder{color:#70757a}
.sbtn{background:transparent;border:0;min-height:0!important;width:44px;height:44px;padding:0!important;font-size:20px;color:inherit;border-radius:50%}
#mChips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
#mChips::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;background:#fff;color:#202124;border:0;border-radius:20px;padding:0 14px!important;min-height:40px!important;font-size:15px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pchip.on{background:#e8f0fe;color:#1a73e8;font-weight:600}
.fab{width:54px;height:54px;min-height:0!important;padding:0!important;border-radius:50%;border:0;background:#fff;color:#1a73e8;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.fab.blue,.fab.on{background:#1a73e8;color:#fff}
#mLyr{position:absolute;right:10px;top:122px;z-index:1100;width:46px;height:46px;font-size:20px}
#mFab{position:absolute;right:10px;bottom:62px;z-index:1100;display:flex;flex-direction:column;gap:12px}
#lyr{position:absolute;right:64px;top:122px;z-index:1200;display:none;flex-direction:column;gap:2px;background:#fff;color:#202124;border-radius:14px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.45);min-width:170px}
#lyr button{background:transparent;border:0;color:inherit;text-align:left;border-radius:8px;min-height:42px!important}
#lyr button.on{background:#e8f0fe;color:#1a73e8;font-weight:600}
#lyr hr{border:0;border-top:1px solid #ddd;margin:4px 0;width:100%}
#mInfo{position:absolute;left:10px;bottom:16px;max-width:calc(100% - 90px);z-index:1100;background:#1a73e8;color:#fff;padding:11px 16px;border-radius:24px;font-size:15px;font-weight:600;display:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chg,#mRes{position:absolute;left:0;right:0;bottom:0;z-index:1150;max-height:58%;overflow:auto;display:none;flex-direction:column;gap:2px;background:#2b2f36;color:#e8eaed;padding:6px 14px 12px;border-radius:20px 20px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.45)}
.sgrab{width:40px;height:4px;border-radius:2px;background:rgba(128,128,128,.6);margin:2px auto 8px;flex:0 0 auto}
.shd{display:flex;align-items:center;gap:8px;margin-bottom:4px}.shd b{flex:1;font-size:16px}
.sx{width:40px;height:40px;min-height:0!important;padding:0!important;border-radius:50%;background:rgba(128,128,128,.25);border:0;color:inherit}
.crow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid rgba(128,128,128,.28);cursor:pointer}
.crow .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .ct b{font-size:15px}.crow .ct span{font-size:13px;opacity:.7}
.cgo{width:44px;height:44px;min-height:0!important;padding:0!important;border-radius:50%;background:#1a73e8;color:#fff;border:0;font-size:20px;flex:0 0 auto}
#chg .hint,#mRes .hint{padding:6px 2px;color:inherit}
#mRes button{text-align:left;white-space:normal;background:transparent;border:0;border-top:1px solid rgba(128,128,128,.28);border-radius:0;color:inherit}
body[data-theme=dark] .fab:not(.on):not(.blue){background:#2b2f36;color:#8ab4f8}
body[data-theme=dark] #mSearch,body[data-theme=dark] #lyr,body[data-theme=dark] .pchip:not(.on){background:#2b2f36;color:#e8eaed}
body[data-theme=dark] #mSearch input::placeholder{color:#9aa0a6}
body[data-theme=dark] .pchip.on,body[data-theme=dark] #lyr button.on{background:#394457;color:#8ab4f8}
body[data-theme=dark] #lyr hr{border-top-color:#444}
body[data-theme=light] #chg,body[data-theme=light] #mRes{background:#fff;color:#202124}
</style>
</head>
<body data-sky="clear-day" data-theme="dark">
<div id="fx"></div>

<div id="bar">
  <button data-p="yt" class="on">▶ Nhạc</button>
  <button data-p="map" class="on">🗺 Bản đồ</button>
  <button data-p="clock">🕒 Đồng hồ</button>
  <button data-p="weather">⛅ Thời tiết</button>
  <span class="sp"></span>
  <button id="bLayout" title="Đổi cách chia màn hình">⇆ Bố cục: tự động</button>
  <button id="bTheme" title="Đổi giao diện Sáng / Tối / Tự động">🌗 Tự động</button>
  <button id="bFull">⛶</button>
</div>

<div id="stage" data-layout="auto">

  <!-- YOUTUBE (Ad-Free) -->
  <section class="panel" id="p-yt">
    <div class="yt-main"><div class="player-wrap"><video id="player" controls playsinline></video><div id="ytMsg"></div><div id="home"></div></div><div id="queue"></div></div>
    <div class="row yctl">
      <button id="yHome" title="Trang chủ">🏠</button>
      <button id="yPrev" title="Bài trước">⏮</button>
      <button id="yPlay" title="Phát / tạm dừng">⏯</button>
      <button id="yNext" title="Bài sau">⏭</button>
      <button id="yMic" title="Nói tên bài hát" style="display:none">🎤</button>
      <button id="yPaste" title="Phát link YouTube đã sao chép">📋</button>
      <input id="yIn" placeholder="Gõ tên bài / ca sĩ, hoặc dán link YouTube">
      <button id="yGo">Phát</button>
      <button id="yAdd" title="Thêm vào danh sách">＋</button>
    </div>
    <div id="ytResults"></div>
    <div id="ytList"></div>
  </section>

  <!-- BẢN ĐỒ -->
  <section class="panel" id="p-map">
    <div class="map-wrap">
      <div id="gwrap"></div><div id="map" style="display:none"></div>
      <div id="mTop">
        <div id="mSearch">
          <button id="mGo" class="sbtn" title="Tìm">🔍</button>
          <input id="mIn" placeholder="Tìm ở đây" enterkeyhint="search" autocomplete="off">
          <button id="mClr" class="sbtn" style="display:none" title="Xóa">✕</button>
          <button id="mMic" class="sbtn" style="display:none" title="Nói nơi cần đến">🎤</button>
        </div>
        <div id="mChips"></div>
      </div>
      <div id="lyr">
        <button data-l="m">🗺 Mặc định</button><button data-l="k">🛰 Vệ tinh</button>
        <hr><button data-e="google">Google Maps</button><button data-e="osm">OpenStreetMap</button>
      </div>
      <button id="mLyr" class="fab" title="Kiểu bản đồ">🗺</button>
      <div id="mFab">
        <button id="mMe" class="fab" title="Vị trí của tôi">🎯</button>
        <button id="mRoute" class="fab blue" title="Chỉ đường từ vị trí hiện tại">➜</button>
      </div>
      <div id="mInfo"></div><div id="mRes"></div><div id="chg"></div>
    </div>
  </section>

  <div id="side">
  <!-- ĐỒNG HỒ -->
  <section class="panel hide" id="p-clock" data-mode="digital" title="Chạm vào giờ để đổi 12h / 24h">
    <button id="clockMode" title="Đổi kiểu đồng hồ">🕒 Kim</button>
    <div id="time">--:--</div>
    <svg id="analog" viewBox="-100 -100 200 200" aria-label="Đồng hồ kim"></svg>
    <div id="date"></div>
    <div id="lunar"></div>
  </section>

  <!-- THỜI TIẾT -->
  <section class="panel hide" id="p-weather">
    <div class="row"><button id="wLoc">📍 …</button><span class="sp" style="flex:1"></span><button id="wRef" title="Cập nhật">⟳</button></div>
    <div id="locRow">
      <div class="row"><input id="locIn" placeholder="Tìm thành phố / huyện"><button id="locGo">Tìm</button><button id="locGps">GPS</button></div>
      <div id="locRes"></div>
    </div>
    <div class="w-top">
      <div class="w-ico" id="wIco">⛅</div>
      <div><div class="w-temp" id="wTemp">--°</div><div class="w-desc" id="wDesc">Đang tải…</div></div>
    </div>
    <div class="w-meta" id="wMeta"></div>
    <div class="title">Theo giờ</div>
    <div class="strip" id="wHour"></div>
    <div class="title">5 ngày tới</div>
    <div class="strip" id="wDay"></div>
  </section>
  </div><!-- /side -->

const INT=Math.floor;
function jdFromDate(dd,mm,yy){

  const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  let C1=(0.1734-0.000393*T)*S(M)+0.0021*S(2*M);

  C1+=0.0104*S(2*F)-0.0051*S(M+Mpr)-0.0074*S(M-Mpr)+0.0004*S(2*F+M);
  C1+=-0.0004*S(2*F-M)-0.0006*S(2*F+Mpr)+0.0010*S(2*F-Mpr)+0.0005*S(2*Mpr+M);
  const dt = T<-11 ? 0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3 : -0.000278+0.000265*T+0.000262*T2;
  return Jd1+C1-dt;

  const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;

  let L=(L0+DL)*dr; L-=Math.PI*2*INT(L/(Math.PI*2));

}
const TZ=7, sunLong=d=>INT(sunLongitude(d-0.5-TZ/24)/Math.PI*6), newMoonDay=k=>INT(newMoon(k)+0.5+TZ/24);

}

function solar2lunar(dd,mm,yy){
  const dayNumber=jdFromDate(dd,mm,yy), k=INT((dayNumber-2415021.076998695)/29.530588853);

let engine = store.get('mapEngine','google'), mapSat = store.get('mapSat',false);
