<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Car Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Routing Machine CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <!-- Leaflet Control Geocoder -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
        @import url('https://fonts.cdnfonts.com/css/eurostile');
        
        body {
            font-family: 'Eurostile', 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
        }

        .font-digital {
            font-family: 'Eurostile', 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Dark mode map styling */
        .leaflet-container {
            background: #0b131e !important;
        }

        /* Routing container customization */
        .leaflet-routing-container {
            background-color: rgba(15, 23, 42, 0.95) !important;
            color: #f8fafc !important;
            border-radius: 0.75rem !important;
            padding: 12px !important;
            max-height: 35vh !important;
            overflow-y: auto;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .leaflet-routing-container input {
            background-color: #1e293b !important;
            color: white !important;
            border: 1px solid #334155 !important;
            border-radius: 0.5rem;
            padding: 6px 10px;
        }
        .leaflet-routing-alt h2 { color: #38bdf8 !important; font-size: 1rem; }
        .leaflet-routing-alt h3 { color: #94a3b8 !important; }
        .leaflet-bar a {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        
        .leaflet-routing-remove-waypoint::after {
            content: "\00d7" !important;
            color: #ef4444 !important;
            font-weight: bold;
        }
        
        #map { width: 100%; height: 100%; z-index: 10; }
        #loading { transition: opacity 0.4s ease-out; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen m-0 p-0">

    <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white">
        <i class="fa-solid fa-car-side text-6xl animate-bounce mb-4 text-sky-400"></i>
        <h1 class="text-2xl font-bold font-digital">HỆ THỐNG SMART CAR</h1>
        <p class="text-slate-400 mt-2">Đang thiết lập kết nối GPS vệ tinh...</p>
    </div>

    <div class="glass-panel w-full md:w-[380px] lg:w-[420px] h-2/5 md:h-full flex flex-col p-3 gap-3 z-20 shadow-2xl order-2 md:order-1 overflow-y-auto">
        
        <!-- Đồng hồ & Lịch Âm Dương (Khung cao gấp đôi, click đổi giữa số và kim) -->
        <div class="glass-card flex flex-col justify-between items-center p-6 min-h-[300px] cursor-pointer hover:bg-slate-800/40 transition-colors border-sky-500/20 relative" onclick="toggleClock()" title="Chạm để chuyển đổi kiểu đồng hồ">
            
            <div class="absolute top-3 right-3 text-xs text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700">
                <i class="fa-solid fa-arrows-rotate mr-1"></i> Đổi kiểu
            </div>

            <!-- Đồng hồ số siêu lớn -->
            <div id="digital-view" class="flex flex-col items-center w-full my-auto">
                <h1 id="clock" class="text-6xl lg:text-7xl leading-none font-digital font-bold text-transparent bg-clip-text bg-gradient-to-b from-white via-sky-100 to-sky-400 drop-shadow-[0_0_20px_rgba(14,165,233,0.4)] tracking-wide">
                    00:00:00
                </h1>
            </div>

            <!-- Đồng hồ kim cổ điển -->
            <div id="analog-view" class="hidden flex-col items-center w-full my-auto py-2">
                <div class="relative w-[140px] h-[140px] rounded-full border-[4px] border-sky-500/50 bg-slate-900/90 shadow-[0_0_20px_rgba(14,165,233,0.3)]">
                    <div class="absolute top-1 left-[64px] w-[2px] h-[10px] bg-sky-400"></div>
                    <div class="absolute bottom-1 left-[64px] w-[2px] h-[10px] bg-sky-400"></div>
                    <div id="hour-hand" class="absolute bg-white rounded-full" style="width:5px; height:38px; top:32px; left:64px; transform-origin: bottom; transform: rotate(0deg);"></div>
                    <div id="minute-hand" class="absolute bg-slate-300 rounded-full" style="width:3px; height:52px; top:18px; left:65px; transform-origin: bottom; transform: rotate(0deg);"></div>
                    <div id="second-hand" class="absolute bg-red-500" style="width:1px; height:56px; top:14px; left:66px; transform-origin: bottom; transform: rotate(0deg);"></div>
                    <div class="absolute bg-sky-400 rounded-full z-10" style="width:10px; height:12px; top:60px; left:60px;"></div>
                </div>
            </div>
            
            <!-- Ngày Dương & Âm Lịch (Cỡ lớn rõ ràng) -->
            <div class="flex flex-col items-center text-center w-full border-t border-slate-700/50 pt-3 mt-auto">
                <p id="date-solar" class="text-base lg:text-lg font-bold text-slate-100 tracking-wide font-digital">---</p>
                <div class="flex items-center justify-center gap-2 mt-2 px-4 py-2 bg-slate-950/90 rounded-full border border-sky-500/30 w-full shadow-inner">
                    <i class="fa-solid fa-moon text-yellow-300 text-base"></i>
                    <p id="date-lunar" class="text-base lg:text-lg text-sky-300 font-bold font-digital">Âm lịch: Ngày 28/8</p>
                </div>
            </div>
        </div>

        <!-- Tiện ích: Thời tiết & Vận tốc -->
        <div class="grid grid-cols-2 gap-2 flex-none">
            <div class="glass-card p-3 flex flex-col justify-center items-center text-center">
                <i class="fa-solid fa-cloud-sun text-2xl text-amber-400 mb-1"></i>
                <span id="weather-location" class="text-[11px] text-slate-400">Định vị GPS</span>
                <span id="weather-temp" class="text-lg font-bold font-digital mt-0.5 text-slate-100">--°C</span>
            </div>
            <div class="glass-card p-3 flex flex-col justify-center items-center text-center border-l-2 border-l-sky-500">
                <i class="fa-solid fa-gauge-high text-2xl text-sky-400 mb-1"></i>
                <span class="text-[11px] text-slate-400">Vận tốc xe</span>
                <span id="speedo" class="text-lg font-bold font-digital mt-0.5 text-sky-400">0 km/h</span>
            </div>
        </div>

        <!-- Lịch tháng trực quan -->
        <div class="glass-card p-4 flex flex-col gap-2">
            <div class="flex justify-between items-center text-sm font-bold text-sky-400 border-b border-slate-700 pb-2">
                <button onclick="changeMonth(-1)" class="hover:text-white px-2 py-1"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="calendar-month-year" class="font-digital tracking-wide">Tháng 10 / 2026</span>
                <button onclick="changeMonth(1)" class="hover:text-white px-2 py-1"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="grid grid-cols-7 text-center text-[11px] text-slate-400 font-bold">
                <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span class="text-red-400">CN</span>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs">
                <!-- Javascript render calendar -->
            </div>
        </div>

        <!-- Trạng thái hệ thống -->
        <div class="glass-card p-3 mt-auto text-xs text-slate-400 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span>Trạng thái xe:</span>
                <span class="text-emerald-400 font-bold"><i class="fa-solid fa-circle-check mr-1"></i> Sẵn sàng</span>
            </div>
            <div class="flex justify-between items-center">
                <span>Hệ thống bản đồ:</span>
                <span class="text-sky-400 font-bold">OpenStreetMap GPS</span>
            </div>
        </div>
    </div>

    <div class="flex-1 h-3/5 md:h-full order-1 md:order-2 relative shadow-inner">
        <div id="map"></div>
    </div>

    <!-- JavaScript Logic System -->
    <script>
        // Bắt lỗi ngầm từ thư viện bên thứ 3
        window.addEventListener('unhandledrejection', function(event) {
            console.warn("Bắt lỗi Promise:", event.reason);
            event.preventDefault();
        });

        let map, routingControl, userMarker;
        let isDigital = true;
        let currentLat = 21.3216, currentLng = 105.2281;
        let todayDate = new Date();
        let displayMonth = todayDate.getMonth();
        let displayYear = todayDate.getFullYear();

        // 1. Đồng hồ số & Kim & Ngày tháng
        function updateClock() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hrs}:${mins}:${secs}`;
            
            if (!isDigital) {
                const hrDeg = ((now.getHours() % 12) * 30) + (now.getMinutes() * 0.5);
                const minDeg = (now.getMinutes() * 6) + (now.getSeconds() * 0.1);
                const secDeg = now.getSeconds() * 6;
                
                document.getElementById('hour-hand').style.transform = `rotate(${hrDeg}deg)`;
                document.getElementById('minute-hand').style.transform = `rotate(${minDeg}deg)`;
                document.getElementById('second-hand').style.transform = `rotate(${secDeg}deg)`;
            }

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-solar').textContent = now.toLocaleDateString('vi-VN', options);
            document.getElementById('date-lunar').textContent = `Âm lịch: Ngày 28/08`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleClock() {
            isDigital = !isDigital;
            if (isDigital) {
                document.getElementById('digital-view').classList.remove('hidden');
                document.getElementById('analog-view').classList.add('hidden');
            } else {
                document.getElementById('digital-view').classList.add('hidden');
                document.getElementById('analog-view').classList.remove('hidden');
            }
        }

        // 2. Render lịch tháng Dương & Âm tương đối
        function renderCalendar(month, year) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            document.getElementById('calendar-month-year').textContent = `Tháng ${month + 1} / ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Bắt đầu từ T2
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Ô trống đầu tháng
            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div></div>`;
            }

            // Các ngày trong tháng
            for (let day = 1; day <= totalDays; day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                const lunarDay = ((day + 10) % 30) + 1; // Giả lập lịch âm tương đối
                
                const cell = document.createElement('div');
                cell.className = `flex flex-col items-center justify-center py-1.5 rounded-lg border border-slate-800 transition-all ${isToday ? 'bg-sky-600 text-white font-bold shadow-lg shadow-sky-500/30' : 'bg-slate-900/40 text-slate-200 hover:bg-slate-800'}`;
                cell.innerHTML = `
                    <span class="text-xs font-digital">${day}</span>
                    <span class="text-[9px] ${isToday ? 'text-sky-200' : 'text-sky-400'} font-digital">28/${lunarDay}</span>
                `;
                grid.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            displayMonth += direction;
            if (displayMonth > 11) {
                displayMonth = 0;
                displayYear++;
            } else if (displayMonth < 0) {
                displayMonth = 11;
                displayYear--;
            }
            renderCalendar(displayMonth, displayYear);
        }
        renderCalendar(displayMonth, displayYear);

        // 3. Thời tiết thời gian thực
        async function fetchWeather(lat, lng) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
                const data = await res.json();
                if (data && data.current_weather) {
                    document.getElementById('weather-temp').textContent = `${Math.round(data.current_weather.temperature)}°C`;
                    document.getElementById('weather-location').textContent = `GPS Thực tế`;
                }
            } catch (e) {
                document.getElementById('weather-temp').textContent = "26°C";
                document.getElementById('weather-location').textContent = "Phú Thọ";
            }
        }

        // 4. Khởi tạo bản đồ Leaflet & Routing
        function initDashboardMap() {
            map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 15);
            
            // Dùng CartoDB Dark Matter trực quan không cần API Key
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                maxZoom: 19
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Thiết lập chỉ đường thông minh với Geocoder Photon
            try {
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(currentLat, currentLng),
                        L.latLng(currentLat + 0.04, currentLng + 0.04)
                    ],
                    routeWhileDragging: false,
                    geocoder: L.Control.Geocoder.photon(),
                    lineOptions: {
                        styles: [{ color: '#0ea5e9', weight: 6, opacity: 0.85 }]
                    }
                }).addTo(map);
            } catch (err) {
                console.log("Routing khởi tạo dạng cơ bản.");
            }

            // Click vào bản đồ để chọn điểm đến chỉ đường
            map.on('click', function(e) {
                if (routingControl) {
                    const waypoints = routingControl.getWaypoints();
                    if (waypoints.length > 0) {
                        routingControl.setWaypoints([
                            waypoints[0].latLng,
                            e.latlng
                        ]);
                    }
                }
            });

            // Định vị GPS thực tế
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    const speedMs = position.coords.speed;

                    if (speedMs !== null && speedMs >= 0) {
                        document.getElementById('speedo').textContent = `${(speedMs * 3.6).toFixed(0)} km/h`;
                    }

                    if (!userMarker) {
                        userMarker = L.marker([currentLat, currentLng]).addTo(map);
                    } else {
                        userMarker.setLatLng([currentLat, currentLng]);
                    }

                    map.setView([currentLat, currentLng], 15);
                    fetchWeather(currentLat, currentLng);

                    if (routingControl) {
                        const waypoints = routingControl.getWaypoints();
                        if (waypoints.length > 0) {
                            waypoints[0].latLng = L.latLng(currentLat, currentLng);
                            routingControl.setWaypoints(waypoints);
                        }
                    }
                }, (error) => {
                    fetchWeather(currentLat, currentLng);
                }, { enableHighAccuracy: true });
            } else {
                fetchWeather(currentLat, currentLng);
            }

            // Ẩn màn hình loading
            setTimeout(() => {
                const loader = document.getElementById('loading');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 400);
                map.invalidateSize();
            }, 1000);
        }

        window.addEventListener('DOMContentLoaded', initDashboardMap);
        window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
        });
    </script>
</body>
</html>
