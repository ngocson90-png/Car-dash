<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Car Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            margin: 0;
            overflow: hidden; /* Prevent scrolling for a dashboard feel */
        }
        .clock-font {
            font-family: 'Share Tech Mono', monospace;
        }
        /* Custom scrollbar for the sidebar if needed */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4); 
        }
        
        /* Ẩn giao diện hướng dẫn mặc định của Leaflet Routing Machine để dashboard gọn gàng */
        .leaflet-routing-container {
            display: none !important;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row">

    <aside class="w-full md:w-1/3 lg:w-1/4 h-auto md:h-full bg-slate-900 flex flex-col p-6 border-b md:border-b-0 md:border-r border-slate-700 shadow-2xl z-10 space-y-6 overflow-y-auto">
        
        <!-- Clock & Date Section -->
        <div class="flex flex-col items-center md:items-start space-y-1 bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-inner">
            <h1 id="time-display" class="text-6xl md:text-7xl font-bold clock-font text-blue-400 tracking-tight">00:00</h1>
            <p id="date-display" class="text-lg md:text-xl font-medium text-slate-300 mt-2">Loading date...</p>
            <div class="flex items-center space-x-2 mt-1">
                <span class="text-sm bg-indigo-900/50 text-indigo-300 py-1 px-3 rounded-full border border-indigo-700/50">
                    <span class="font-bold">Âm lịch:</span> <span id="lunar-date-display">...</span>
                </span>
            </div>
        </div>

        <!-- Weather Section -->
        <div class="flex items-center justify-between bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-inner">
            <div class="flex flex-col">
                <span class="text-sm text-slate-400 font-medium uppercase tracking-wider">Thời tiết</span>
                <span id="weather-desc" class="text-lg font-semibold text-slate-200">Đang tải...</span>
            </div>
            <div class="flex items-center space-x-3">
                <span id="weather-icon" class="text-4xl text-yellow-400">🌤️</span>
                <span id="weather-temp" class="text-3xl font-bold clock-font text-white">--°</span>
            </div>
        </div>

        <!-- Calendar Section -->
        <div class="flex-grow flex flex-col bg-slate-800 p-4 lg:p-5 rounded-2xl border border-slate-700 shadow-inner">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm text-slate-400 font-medium uppercase tracking-wider">Lịch tháng</h2>
                <div id="calendar-month-year" class="text-lg font-bold text-white tracking-wide">Tháng --, ----</div>
            </div>
            
            <!-- Days of Week -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
                <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div class="text-red-400">CN</div>
            </div>
            
            <!-- Calendar Grid -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm md:text-base flex-grow content-start">
                <!-- Days will be dynamically injected here -->
            </div>
        </div>
    </aside>

    <main class="flex-grow h-full relative w-full bg-slate-950">
        <!-- Leaflet Map Container -->
        <div id="map" class="w-full h-full z-0"></div>
        
        <!-- Loading Overlay for Map -->
        <div id="map-loading" class="absolute inset-0 flex items-center justify-center bg-slate-900 z-10">
            <div class="flex flex-col items-center space-y-4">
                <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-400 font-medium">Đang tải bản đồ & vị trí...</p>
            </div>
        </div>

        <!-- Navigation Search UI -->
        <div class="absolute top-4 left-4 right-16 md:left-8 md:right-auto md:w-[350px] z-[400]">
            <div class="bg-slate-900/90 p-2 rounded-2xl border border-slate-700 shadow-2xl backdrop-blur-md flex items-center space-x-2">
                <input type="text" id="destination-input" placeholder="Tìm điểm đến (vd: Hoan Kiem)..." class="bg-transparent text-white px-3 py-2 outline-none w-full placeholder-slate-400 text-sm font-medium">
                <button id="navigate-btn" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl transition-colors shadow-lg shadow-blue-900/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
            </div>
            
            <!-- Route Info Panel -->
            <div id="route-info" class="hidden mt-3 bg-slate-900/95 p-4 rounded-2xl border border-slate-700 shadow-2xl backdrop-blur-md">
                <div class="flex justify-between items-end border-b border-slate-700/50 pb-3 mb-3">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Thời gian tới</span>
                        <span id="route-time" class="text-2xl font-bold text-emerald-400 clock-font drop-shadow-md">--</span>
                    </div>
                    <div class="flex flex-col text-right">
                        <span class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Khoảng cách</span>
                        <span id="route-distance" class="text-lg font-bold text-white">-- km</span>
                    </div>
                </div>
                <button id="cancel-route-btn" class="w-full py-2 bg-red-900/30 hover:bg-red-900/60 border border-red-900/50 text-red-400 text-sm font-semibold rounded-lg transition-colors">Hủy chuyến đi</button>
            </div>
        </div>

        <!-- Demo Mode Toggle -->
        <div class="absolute top-4 right-4 z-[400] bg-slate-900/90 p-3 rounded-xl border border-slate-700 shadow-xl backdrop-blur-sm">
            <label class="flex items-center space-x-3 cursor-pointer">
                <div class="relative">
                    <input type="checkbox" id="demo-mode-toggle" class="sr-only">
                    <div class="block bg-slate-700 w-10 h-6 rounded-full transition-colors toggle-bg"></div>
                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-medium text-white">Chế độ Mô phỏng</span>
                    <span class="text-xs text-slate-400">Giả lập di chuyển khi bị chặn GPS</span>
                </div>
            </label>
        </div>
    </main>

    <style>
        /* Custom toggle styles */
        #demo-mode-toggle:checked ~ .toggle-bg { background-color: #3b82f6; }
        #demo-mode-toggle:checked ~ .dot { transform: translateX(100%); }
    </style>

    <script>
        // --- 1. Clock & Date Logic ---
        function updateClock() {
            const now = new Date();
            
            // Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').textContent = `${hours}:${minutes}`;
            
            // Gregorian Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const gregDateStr = now.toLocaleDateString('vi-VN', options);
            // Capitalize first letter
            document.getElementById('date-display').textContent = gregDateStr.charAt(0).toUpperCase() + gregDateStr.slice(1);
            
            // Lunar Date (Using built-in Intl API for Chinese calendar)
            try {
                const lunarFormatter = new Intl.DateTimeFormat('vi-VN-u-ca-chinese', {
                    day: 'numeric',
                    month: 'numeric',
                    year: 'numeric'
                });
                const lunarRaw = lunarFormatter.format(now);
                // The format usually comes out like "28/8/2026", we just clean it up slightly
                document.getElementById('lunar-date-display').textContent = lunarRaw.replace(/Năm/i, '').trim();
            } catch (e) {
                console.error("Lunar calendar API not supported by browser", e);
                document.getElementById('lunar-date-display').textContent = "Không hỗ trợ";
            }
        }
        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        // --- 2. Weather Logic (Open-Meteo API) ---
        const weatherCodes = {
            0: { desc: 'Trời quang', icon: '☀️' },
            1: { desc: 'Ít mây', icon: '🌤️' },
            2: { desc: 'Có mây', icon: '⛅' },
            3: { desc: 'Nhiều mây', icon: '☁️' },
            45: { desc: 'Sương mù', icon: '🌫️' },
            48: { desc: 'Sương mù lạnh', icon: '🌫️' },
            51: { desc: 'Mưa phùn nhẹ', icon: '🌧️' },
            53: { desc: 'Mưa phùn', icon: '🌧️' },
            55: { desc: 'Mưa phùn dày', icon: '🌧️' },
            61: { desc: 'Mưa nhỏ', icon: '🌧️' },
            63: { desc: 'Mưa vừa', icon: '🌧️' },
            65: { desc: 'Mưa to', icon: '🌧️' },
            71: { desc: 'Tuyết nhẹ', icon: '❄️' },
            73: { desc: 'Tuyết vừa', icon: '❄️' },
            75: { desc: 'Tuyết dày', icon: '❄️' },
            95: { desc: 'Dông sét', icon: '⛈️' }
        };

        function fetchWeather(lat, lng) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&timezone=auto`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const temp = Math.round(data.current_weather.temperature);
                    const code = data.current_weather.weathercode;
                    const weatherInfo = weatherCodes[code] || { desc: 'Không rõ', icon: '🌡️' };
                    
                    document.getElementById('weather-temp').textContent = `${temp}°`;
                    document.getElementById('weather-desc').textContent = weatherInfo.desc;
                    document.getElementById('weather-icon').textContent = weatherInfo.icon;
                })
                .catch(err => {
                    console.error("Error fetching weather:", err);
                    document.getElementById('weather-desc').textContent = "Lỗi dữ liệu";
                });
        }
    </script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Routing & Geocoder plugins -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script>
        // --- 3. Map Logic (Leaflet + OpenStreetMap) ---
        let map;
        let userMarker;
        let userLocation = null;
        let watchId;
        let isMapCenteredOnce = false;
        
        let routingControl = null;
        let destinationMarker = null;

        // Demo mode variables
        let isDemoMode = false;
        let demoInterval = null;
        let demoRouteCoordinates = [];
        let demoCurrentIndex = 0;
        let mapLocationActive = false;

        function initMap() {
            // Default center (Hanoi)
            const defaultCenter = [21.0285, 105.8542]; 

            // Initialize Leaflet Map
            map = L.map('map', {
                zoomControl: false // We will use custom controls if needed, or hide it for a cleaner dashboard
            }).setView(defaultCenter, 15);

            // Add Dark-themed Map Tiles (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // Create custom icon for the car/user
            const carIcon = L.divIcon({
                className: 'custom-car-icon',
                html: `<div style="background-color: #3b82f6; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(59,130,246,0.8);"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            // Add user marker
            userMarker = L.marker(defaultCenter, { icon: carIcon }).addTo(map);

            // Add listener to the Demo Mode toggle
            document.getElementById('demo-mode-toggle').addEventListener('change', function(e) {
                isDemoMode = e.target.checked;
                if (isDemoMode) {
                    startDemoMode();
                } else {
                    stopDemoMode();
                    // Try to resume real tracking if it was working
                    if(mapLocationActive) startLocationTracking();
                }
            });

            startLocationTracking();
        }

        function startLocationTracking() {
            if (isDemoMode) return; // Don't start real tracking if demo is on

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        mapLocationActive = true;
                        const { latitude, longitude } = position.coords;
                        updateUserLocation(L.latLng(latitude, longitude));
                        document.getElementById('demo-mode-toggle').parentElement.parentElement.classList.add('hidden'); // Hide demo toggle if real GPS works
                    },
                    (error) => {
                        mapLocationActive = false;
                        handleLocationError(error);
                    },
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
                );
            } else {
                handleLocationError({ code: 0, message: "Trình duyệt không hỗ trợ định vị." });
            }
        }

        function updateUserLocation(latLng) {
            userLocation = latLng;
            userMarker.setLatLng(userLocation);
            
            document.getElementById('map-loading').style.display = 'none';

            if (!isMapCenteredOnce || isDemoMode) {
                map.setView(userLocation, 16);
                if(!isMapCenteredOnce) {
                    isMapCenteredOnce = true;
                    fetchWeather(userLocation.lat, userLocation.lng);
                }
            }
        }

        function handleLocationError(error) {
            let errorMsg = "Lỗi định vị không xác định.";
            if (error.code === 1) { // PERMISSION_DENIED
                errorMsg = "Bị chặn quyền truy cập vị trí (Có thể do iframe).";
                // Auto-enable demo mode if blocked by permissions policy
                if(error.message.includes("permissions policy")) {
                     document.getElementById('demo-mode-toggle').checked = true;
                     isDemoMode = true;
                     startDemoMode();
                     console.log(`${errorMsg} Đã tự động bật chế độ Mô phỏng.`);
                     return;
                }
            } else if (error.code === 2) { // POSITION_UNAVAILABLE
                errorMsg = "Thông tin vị trí không khả dụng.";
            } else if (error.code === 3) { // TIMEOUT
                errorMsg = "Quá thời gian yêu cầu lấy vị trí.";
            }
            
            console.error(`Lỗi định vị (${error.code}):`, error.message);
            
            // Fallback location (Hanoi)
            const fallbackLocation = L.latLng(21.0285, 105.8542);
            updateUserLocation(fallbackLocation);
        }

        // --- Demo Mode Logic ---
        function startDemoMode() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            
            console.log("Đang chạy chế độ Mô phỏng (GPS ảo)...");
            
            // Generate a fake circle around current location IF no route is active
            if (!routingControl && demoRouteCoordinates.length === 0) {
                 const base = userLocation || L.latLng(21.0285, 105.8542);
                 demoRouteCoordinates = generateFakeRoute(base, 0.02, 50);
                 demoCurrentIndex = 0;
            }

            if (demoInterval) clearInterval(demoInterval);
            demoInterval = setInterval(() => {
                if (demoCurrentIndex < demoRouteCoordinates.length) {
                    updateUserLocation(demoRouteCoordinates[demoCurrentIndex]);
                    demoCurrentIndex++;
                } else {
                    // Loop the demo route, or stop if we arrived at destination
                    if (routingControl) {
                        stopDemoMode();
                        // Optional: trigger arrival alert here
                    } else {
                        demoCurrentIndex = 0;
                    }
                }
            }, 1000); // Move every second
        }

        function stopDemoMode() {
            if (demoInterval) clearInterval(demoInterval);
            demoInterval = null;
            console.log("Đã tắt Mô phỏng. Đang thử lấy GPS thật...");
        }

        function generateFakeRoute(startLatLng, radius, steps) {
            const coords = [];
            for (let i = 0; i < steps; i++) {
                const angle = (i / steps) * Math.PI * 2;
                // slightly random movement
                const dx = Math.cos(angle) * radius + (Math.random() * 0.002 - 0.001);
                const dy = Math.sin(angle) * radius + (Math.random() * 0.002 - 0.001);
                coords.push(L.latLng(startLatLng.lat + dy, startLatLng.lng + dx));
            }
            return coords;
        }

        // --- Navigation Logic ---
        function searchAndNavigate() {
            const input = document.getElementById('destination-input').value;
            if (!input) return;
            if (!userLocation) {
                alert("Đang chờ tín hiệu GPS. Vui lòng đợi trong giây lát.");
                return;
            }

            // Visual feedback on button
            const btn = document.getElementById('navigate-btn');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;

            // Use Nominatim Geocoder to find coordinates
            const geocoder = L.Control.Geocoder.nominatim();
            geocoder.geocode(input, (results) => {
                btn.innerHTML = originalIcon;
                if (results && results.length > 0) {
                    const dest = results[0].center;
                    startRouting(dest, results[0].name);
                } else {
                    alert("Không tìm thấy địa điểm, vui lòng thử lại tên khác.");
                }
            });
        }

        function startRouting(destLatLng, destName) {
            if (routingControl) map.removeControl(routingControl);
            if (destinationMarker) map.removeLayer(destinationMarker);

            // Add Custom Destination Pin
            const destIcon = L.divIcon({
                className: 'custom-dest-icon',
                html: `<div style="background-color: #ef4444; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 24]
            });
            destinationMarker = L.marker(destLatLng, { icon: destIcon }).addTo(map);
            destinationMarker.bindPopup(`<div class="font-sans"><b>Điểm đến:</b><br><span class="text-xs text-gray-600">${destName}</span></div>`).openPopup();

            // Set up Route Calculation
            routingControl = L.Routing.control({
                waypoints: [ userLocation, destLatLng ],
                routeWhileDragging: false,
                addWaypoints: false,
                show: false, // Hide the large instruction panel
                createMarker: () => null, // Hide default ugly markers
                lineOptions: {
                    styles: [{ color: '#3b82f6', opacity: 0.9, weight: 6, shadowColor: '#000', shadowBlur: 10 }]
                }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const route = e.routes[0];
                
                // Update UI Navigation Panel
                document.getElementById('route-info').classList.remove('hidden');
                
                const totalMinutes = Math.round(route.summary.totalTime / 60);
                let timeString = totalMinutes < 60 ? `${totalMinutes} phút` : `${Math.floor(totalMinutes/60)}h ${totalMinutes%60}p`;
                document.getElementById('route-time').textContent = timeString;
                
                const distanceKm = (route.summary.totalDistance / 1000).toFixed(1);
                document.getElementById('route-distance').textContent = `${distanceKm} km`;

                // If Demo Mode is active, override tracking with the route coordinates
                if (isDemoMode) {
                    demoRouteCoordinates = route.coordinates;
                    demoCurrentIndex = 0;
                    startDemoMode(); // Restart simulation on the new route
                }
            });
            
            routingControl.on('routingerror', function(e) {
                console.error("Lỗi vẽ tuyến đường:", e);
                alert("Không thể tìm được đường xe đi khả thi tới điểm này.");
            });
        }

        // Event Listeners for Nav UI
        document.getElementById('navigate-btn').addEventListener('click', searchAndNavigate);
        document.getElementById('destination-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAndNavigate();
        });
        
        document.getElementById('cancel-route-btn').addEventListener('click', () => {
            if (routingControl) map.removeControl(routingControl);
            if (destinationMarker) map.removeLayer(destinationMarker);
            routingControl = null;
            
            document.getElementById('route-info').classList.add('hidden');
            document.getElementById('destination-input').value = '';
            
            // Revert to circular driving pattern if in Demo Mode
            if (isDemoMode) {
                demoRouteCoordinates = generateFakeRoute(userLocation || L.latLng(21.0285, 105.8542), 0.02, 50);
                demoCurrentIndex = 0;
                startDemoMode();
            }
        });

        // --- 4. Calendar Logic ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYear = document.getElementById('calendar-month-year');
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const currentDate = now.getDate();

            // Display Month/Year
            monthYear.textContent = `Tháng ${currentMonth + 1}, ${currentYear}`;

            // Get first day of month and total days
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            // Adjust first day to start on Monday (0 = Mon, ..., 6 = Sun)
            let startDay = firstDay === 0 ? 6 : firstDay - 1;

            grid.innerHTML = ''; // Clear previous

            // Empty cells for previous month padding
            for (let i = 0; i < startDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'p-1';
                grid.appendChild(emptyDiv);
            }

            const getLunarDateForCell = (day, month, year) => {
                try {
                    const dateObj = new Date(year, month, day);
                    const lunarFormatter = new Intl.DateTimeFormat('vi-VN-u-ca-chinese', {
                        day: 'numeric',
                        month: 'numeric'
                    });
                    const rawLunar = lunarFormatter.format(dateObj); // returns something like "28/8"
                    const parts = rawLunar.split('/');
                    
                    if (parts.length >= 2) {
                        // If it's the 1st of the lunar month, display "1/month" (e.g., "1/8")
                        if (parts[0] === '1') {
                            return `${parts[0]}/${parts[1]}`;
                        }
                        return parts[0];
                    }
                    return rawLunar.replace(/Năm/i, '').trim();
                } catch (e) {
                    return "";
                }
            };

            // Days of the month
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                
                dayDiv.className = 'flex flex-col items-center justify-center p-1 md:p-1.5 rounded-xl transition-colors cursor-default select-none aspect-square';
                
                // Solar Day
                const numSpan = document.createElement('span');
                numSpan.textContent = i;
                numSpan.className = 'z-10 text-sm md:text-base font-bold leading-none';
                
                // Lunar Day
                const lunarSpan = document.createElement('span');
                lunarSpan.textContent = getLunarDateForCell(i, currentMonth, currentYear);
                lunarSpan.className = 'z-10 text-[9px] md:text-[10px] mt-1 leading-none font-medium';

                // Highlight current day
                if (i === currentDate) {
                    dayDiv.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-900/50');
                    lunarSpan.classList.add('text-blue-200');
                } else {
                    dayDiv.classList.add('text-slate-200', 'hover:bg-slate-700/50');
                    lunarSpan.classList.add('text-slate-500');
                }
                
                dayDiv.appendChild(numSpan);
                dayDiv.appendChild(lunarSpan);
                grid.appendChild(dayDiv);
            }
        }

        // Initialize map and calendar on load
        window.addEventListener('load', () => {
            initMap();
            renderCalendar();
        });
    </script>
</body>
</html>
