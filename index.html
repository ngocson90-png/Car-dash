<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Car Dash</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg1:#4facfe; --bg2:#00c6fb;
  --panel:rgba(0,0,0,.30); --panel2:rgba(255,255,255,.12);
  --text:#fff; --muted:rgba(255,255,255,.7); --accent:#ffd54a;
}
body[data-sky=clear-day]{--bg1:#2f80ed;--bg2:#56ccf2}
body[data-sky=clear-night]{--bg1:#0f2027;--bg2:#2c5364}
body[data-sky=cloud-day]{--bg1:#5b6b85;--bg2:#9fb0c6}
body[data-sky=cloud-night]{--bg1:#1c1e22;--bg2:#3d4147}
body[data-sky=rain]{--bg1:#2b3a4b;--bg2:#4b6076}
body[data-sky=storm]{--bg1:#12122a;--bg2:#2a2f55}
body[data-sky=fog]{--bg1:#5f6f7a;--bg2:#a9b6bf}
body[data-sky=snow]{--bg1:#6f93c4;--bg2:#b7d3ee}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  transition:background 1s;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);
}
button,input{font:inherit;color:inherit}
button{
  background:var(--panel2);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  padding:7px 11px;cursor:pointer;white-space:nowrap;
}
button:active{transform:scale(.97)}
button.on{background:var(--accent);color:#222;border-color:var(--accent);font-weight:600}
input{
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:10px;
  padding:7px 10px;min-width:0;flex:1;outline:none;
}
input::placeholder{color:var(--muted)}

/* thanh trên */
#bar{display:flex;gap:6px;padding:8px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar .sp{flex:1}

/* khu vực chính */
#stage{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px calc(8px + env(safe-area-inset-bottom));flex-direction:row}
@media (max-aspect-ratio:1/1){#stage{flex-direction:column}}
#stage[data-layout=row]{flex-direction:row!important}
#stage[data-layout=col]{flex-direction:column!important}

.panel{
  flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border-radius:16px;padding:8px;gap:8px;overflow:hidden;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#p-yt,#p-map{flex-grow:2}
.panel.hide{display:none}
/* cột phụ: đồng hồ + thời tiết chia đôi nhau */
#side{flex:1 1 0;min-width:0;min-height:0;display:flex;gap:8px;flex-direction:column}
#side.hide{display:none}
@media (max-aspect-ratio:1/1){#side{flex-direction:row}}
#stage[data-layout=row] #side{flex-direction:column!important}
#stage[data-layout=col] #side{flex-direction:row!important}
#p-yt.hide{display:flex;position:fixed;left:-9999px;top:0;width:320px;height:300px}
.row{display:flex;gap:6px;align-items:center}
.title{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* youtube */
.player-wrap{flex:1;min-height:110px;border-radius:12px;overflow:hidden;background:#000;position:relative}
.player-wrap iframe{width:100%;height:100%;border:0}
#ytMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:14px;line-height:1.5;background:rgba(0,0,0,.82);z-index:2;flex-direction:column;gap:8px}
#ytMsg a{color:var(--accent)}
/* trang chủ YouTube (lưới bài hát bấm là phát) */
#home{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:8px;padding:10px;background:#0b121c;overflow:auto;text-align:left}
#home.open{display:flex}
#home h4{margin:8px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
#home .hint{font-size:13px;color:var(--muted);line-height:1.5}
#homeTop{display:flex;gap:6px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{cursor:pointer;background:var(--panel2);border-radius:10px;overflow:hidden;font-size:12px;line-height:1.3}
.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.tile div{padding:6px 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.cur{outline:2px solid var(--accent)}
#ytList{display:none}
#p-yt{container-type:inline-size}
.yt-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.yt-main .player-wrap{flex:1;min-height:110px}
#queue{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
#queue:empty{display:none}
#queue .tile{flex:0 0 128px}
@container (min-width:640px){
  .yt-main{flex-direction:row}
  #queue{flex-direction:column;overflow-x:hidden;overflow-y:auto;width:230px}
  #queue .tile{flex:0 0 auto;display:flex;gap:8px;align-items:center}
  #queue .tile img{width:96px;flex:0 0 96px}
  #queue .tile div{padding:4px 4px 4px 0;-webkit-line-clamp:3}
}
.item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:13px}
.item.cur{outline:2px solid var(--accent)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.item button{padding:2px 8px}
.res{display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px;border-radius:8px;background:var(--panel2);font-size:13px}
.res img{width:64px;height:36px;object-fit:cover;border-radius:6px}
#ytResults{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px}
#ytResults:empty{display:none}

/* map */
.map-wrap{flex:1;min-height:110px;border-radius:16px;overflow:hidden;background:#222;position:relative}
#map{position:absolute;inset:0;touch-action:none}
.leaflet-container{font:inherit;background:#222}
.leaflet-control-zoom a{width:42px!important;height:42px!important;line-height:42px!important;font-size:24px!important}

/* đồng hồ */
#p-clock{align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;container-type:size}
#clockMode{position:absolute;top:8px;right:8px;z-index:2}
#analog{display:none;width:min(80cqw,52cqh,340px);aspect-ratio:1;flex:0 1 auto;min-height:0}
#p-clock[data-mode=analog] #time{display:none}
#p-clock[data-mode=analog] #analog{display:block}
#analog .face{fill:rgba(0,0,0,.25);stroke:rgba(255,255,255,.6);stroke-width:2}
#analog .tick{stroke:rgba(255,255,255,.6);stroke-width:1}
#analog .tick.h{stroke:#fff;stroke-width:2.5}
#analog text{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
#analog .hand{stroke:#fff;stroke-linecap:round}
#analog .sec{stroke:var(--accent);stroke-width:1.5}
#time{font-size:min(17cqw,22cqh,110px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#time small{font-size:.35em;font-weight:500;margin-left:.15em;color:var(--muted)}
#date{font-size:clamp(14px,2.6vh,22px);color:var(--muted);margin-top:6px}
#lunar{margin-top:10px;font-size:clamp(14px,2.6vh,22px);background:var(--panel2);border-radius:12px;padding:8px 14px;line-height:1.5}
#lunar b{color:var(--accent);font-size:1.25em}
#lunar small{display:block;color:var(--muted);font-size:.8em}

/* thời tiết */
#p-weather{overflow:auto}
.w-top{display:flex;align-items:center;gap:10px}
.w-ico{font-size:clamp(44px,9vh,72px);line-height:1}
.w-temp{font-size:clamp(36px,7vh,60px);font-weight:700;line-height:1}
.w-desc{color:var(--muted);font-size:14px}
.w-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cell{flex:0 0 auto;min-width:56px;text-align:center;background:var(--panel2);border-radius:10px;padding:6px 4px;font-size:12px}
.cell b{display:block;font-size:14px}
.cell .e{font-size:20px}
#locRow{display:none;flex-direction:column;gap:6px}
#locRes{display:flex;flex-direction:column;gap:4px}
#locRes button{text-align:left}
#wLoc{background:none;border:0;padding:0;font-weight:600;font-size:15px;text-align:left}

/* hiệu ứng mưa / tuyết */
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1s}
#fx.rain{opacity:.5;background-image:linear-gradient(105deg,transparent 48%,rgba(255,255,255,.55) 50%,transparent 52%);background-size:26px 90px;animation:rain .45s linear infinite}
#fx.snow{opacity:.7;background-image:radial-gradient(circle,#fff 2px,transparent 3px);background-size:48px 48px;animation:snow 5s linear infinite}
@keyframes rain{to{background-position:-26px 90px}}
@keyframes snow{to{background-position:20px 48px}}
#toast{position:fixed;left:50%;top:64px;max-width:90vw;text-align:center;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 14px;border-radius:10px;font-size:13px;z-index:10;display:none}
.yctl{flex-wrap:wrap}
.yctl input{flex:1 1 150px}
@media (pointer:coarse){
  button{min-height:46px;padding:9px 14px;font-size:16px}
  input{min-height:46px;font-size:16px}
  .tile{font-size:14px}
  #home .chips button{min-height:54px;font-size:17px;flex:1 1 140px}
}
#gwrap{position:absolute;inset:0}
.gframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.chgpin{font-size:18px;text-align:center;line-height:30px;background:#2e7d32;border:2px solid #fff;border-radius:50%;color:#fff}
#ytMsg{color:#fff}
/* bản đồ Google ban đêm: đảo màu bản đồ cho dịu mắt */
body[data-theme=dark] #gwrap:not(.sat) .gframe{filter:invert(.92) hue-rotate(180deg) contrast(.92)}
/* giao diện SÁNG */
body[data-theme=light]{--bg1:#cfe6ff;--bg2:#f4f9ff;--panel:rgba(255,255,255,.74);--panel2:rgba(0,0,0,.07);--text:#12202f;--muted:rgba(18,32,47,.62);--accent:#ffb300}
body[data-theme=light][data-sky=rain],body[data-theme=light][data-sky=storm]{--bg1:#c3cedb;--bg2:#e9eef4}
body[data-theme=light][data-sky=fog],body[data-theme=light][data-sky=cloud-day],body[data-theme=light][data-sky=cloud-night]{--bg1:#d5dce6;--bg2:#f1f4f8}
body[data-theme=light] button{border-color:rgba(0,0,0,.16)}
body[data-theme=light] button.on{color:#1d1400}
body[data-theme=light] input{background:rgba(255,255,255,.95);border-color:rgba(0,0,0,.2)}
body[data-theme=light] #home{background:#f3f7fb}
body[data-theme=light] #analog .face{fill:rgba(255,255,255,.55);stroke:rgba(0,0,0,.45)}
body[data-theme=light] #analog .tick{stroke:rgba(0,0,0,.4)}
body[data-theme=light] #analog .tick.h{stroke:#12202f}
body[data-theme=light] #analog text{fill:#12202f}
body[data-theme=light] #analog .hand{stroke:#12202f}
body[data-theme=light] #analog .sec{stroke:#e65100}
body[data-theme=light] #lunar b{color:#a35d00}
#p-map{padding:0;gap:0}
#mTop{position:absolute;left:10px;right:10px;top:10px;z-index:1100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#mTop>*{pointer-events:auto}
#mSearch{display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;background:#fff;color:#202124;border-radius:26px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#mSearch input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font-size:17px;min-height:0;padding:0 4px;border-radius:0;outline:none}
#mSearch input::placeholder{color:#70757a}
.sbtn{background:transparent;border:0;min-height:0!important;width:44px;height:44px;padding:0!important;font-size:20px;color:inherit;border-radius:50%}
#mChips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
#mChips::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;background:#fff;color:#202124;border:0;border-radius:20px;padding:0 14px!important;min-height:40px!important;font-size:15px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pchip.on{background:#e8f0fe;color:#1a73e8;font-weight:600}
.fab{width:54px;height:54px;min-height:0!important;padding:0!important;border-radius:50%;border:0;background:#fff;color:#1a73e8;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.fab.blue,.fab.on{background:#1a73e8;color:#fff}
#mLyr{position:absolute;right:10px;top:122px;z-index:1100;width:46px;height:46px;font-size:20px}
#mFab{position:absolute;right:10px;bottom:62px;z-index:1100;display:flex;flex-direction:column;gap:12px}
#lyr{position:absolute;right:64px;top:122px;z-index:1200;display:none;flex-direction:column;gap:2px;background:#fff;color:#202124;border-radius:14px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.45);min-width:170px}
#lyr button{background:transparent;border:0;color:inherit;text-align:left;border-radius:8px;min-height:42px!important}
#lyr button.on{background:#e8f0fe;color:#1a73e8;font-weight:600}
#lyr hr{border:0;border-top:1px solid #ddd;margin:4px 0;width:100%}
#mInfo{position:absolute;left:10px;bottom:16px;max-width:calc(100% - 90px);z-index:1100;background:#1a73e8;color:#fff;padding:11px 16px;border-radius:24px;font-size:15px;font-weight:600;display:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chg,#mRes{position:absolute;left:0;right:0;bottom:0;z-index:1150;max-height:58%;overflow:auto;display:none;flex-direction:column;gap:2px;background:#2b2f36;color:#e8eaed;padding:6px 14px 12px;border-radius:20px 20px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.45)}
.sgrab{width:40px;height:4px;border-radius:2px;background:rgba(128,128,128,.6);margin:2px auto 8px;flex:0 0 auto}
.shd{display:flex;align-items:center;gap:8px;margin-bottom:4px}.shd b{flex:1;font-size:16px}
.sx{width:40px;height:40px;min-height:0!important;padding:0!important;border-radius:50%;background:rgba(128,128,128,.25);border:0;color:inherit}
.crow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid rgba(128,128,128,.28);cursor:pointer}
.crow .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .ct b{font-size:15px}.crow .ct span{font-size:13px;opacity:.7}
.cgo{width:44px;height:44px;min-height:0!important;padding:0!important;border-radius:50%;background:#1a73e8;color:#fff;border:0;font-size:20px;flex:0 0 auto}
#chg .hint,#mRes .hint{padding:6px 2px;color:inherit}
#mRes button{text-align:left;white-space:normal;background:transparent;border:0;border-top:1px solid rgba(128,128,128,.28);border-radius:0;color:inherit}
body[data-theme=dark] .fab:not(.on):not(.blue){background:#2b2f36;color:#8ab4f8}
body[data-theme=dark] #mSearch,body[data-theme=dark] #lyr,body[data-theme=dark] .pchip:not(.on){background:#2b2f36;color:#e8eaed}
body[data-theme=dark] #mSearch input::placeholder{color:#9aa0a6}
body[data-theme=dark] .pchip.on,body[data-theme=dark] #lyr button.on{background:#394457;color:#8ab4f8}
body[data-theme=dark] #lyr hr{border-top-color:#444}
body[data-theme=light] #chg,body[data-theme=light] #mRes{background:#fff;color:#202124}
.cgo2{height:44px;min-height:0!important;padding:0 12px!important;border-radius:22px;background:transparent;color:#8ab4f8;border:1.5px solid #8ab4f8;font-size:15px;font-weight:700;flex:0 0 auto}
body[data-theme=light] .cgo2{color:#1a73e8;border-color:#1a73e8}
.cgo{font-size:18px}
#navTop,#navBot,#nSpeed{display:none}
.navmode #navTop{display:block;position:absolute;left:8px;right:8px;top:8px;z-index:1150}
.nmain{display:flex;gap:12px;align-items:center;background:#0f6b5a;color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.nico{font-size:46px;line-height:1;width:58px;text-align:center;flex:0 0 auto}
.nico span,.nthen span{display:inline-block}
.ntxt{display:flex;flex-direction:column;min-width:0}
.ntxt b{font-size:30px;line-height:1.1}
.ntxt span{font-size:19px;opacity:.96;overflow:hidden;text-overflow:ellipsis}
#nThen{align-items:center;gap:8px;background:#0b4f43;color:#fff;border-radius:0 0 14px 14px;padding:6px 14px;font-size:15px;margin-left:14px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.nthen{font-size:20px}
.navmode #navBot{display:flex;position:absolute;left:8px;right:8px;bottom:8px;z-index:1150;align-items:center;gap:10px;background:#1c1f26;color:#fff;border-radius:22px;padding:10px 12px 10px 18px;box-shadow:0 -2px 12px rgba(0,0,0,.5)}
.nsum{flex:1;display:flex;flex-direction:column;min-width:0}
.nsum b{font-size:27px;line-height:1.15}
.nsum span{font-size:15px;opacity:.8}
#nExit{background:#d93025;color:#fff;border:0;border-radius:28px;padding:0 24px;min-height:50px!important;font-size:18px;font-weight:700}
#nVol.fab{width:48px;height:48px;background:#2b2f36;color:#fff;font-size:20px}
.navmode #nSpeed{display:flex;position:absolute;left:10px;bottom:98px;z-index:1100;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#fff;color:#202124;border:3px solid #cfd2d6;box-shadow:0 2px 8px rgba(0,0,0,.45);line-height:1}
#nSpeed b{font-size:24px}#nSpeed small{font-size:11px;opacity:.7}
.navmode #mTop,.navmode #mRoute,.navmode #mLyr,.navmode #lyr,.navmode #mInfo,.navmode .leaflet-control-zoom{display:none!important}
.navmode #mFab{bottom:98px}
.navmode .leaflet-bottom.leaflet-right{bottom:84px}
.carwrap{transition:transform .9s linear}
.car{transition:transform .5s ease-out}
</style>
</head>
<body data-sky="clear-day" data-theme="dark">
<div id="fx"></div>

<div id="bar">
  <button data-p="yt" class="on">▶ YouTube</button>
  <button data-p="map" class="on">🗺 Bản đồ</button>
  <button data-p="clock">🕒 Đồng hồ</button>
  <button data-p="weather">⛅ Thời tiết</button>
  <span class="sp"></span>
  <button id="bLayout" title="Đổi cách chia màn hình">⇆ Bố cục: tự động</button>
  <button id="bTheme" title="Đổi giao diện Sáng / Tối / Tự động">🌗 Tự động</button>
  <button id="bFull">⛶</button>
</div>

<div id="stage" data-layout="auto">

  <!-- YOUTUBE -->
  <section class="panel" id="p-yt">
    <div class="yt-main"><div class="player-wrap"><div id="player"></div><div id="ytMsg"></div><div id="home"></div></div><div id="queue"></div></div>
    <div class="row yctl">
      <button id="yHome" title="Trang chủ">🏠</button>
      <button id="yPrev" title="Bài trước">⏮</button>
      <button id="yPlay" title="Phát / tạm dừng">⏯</button>
      <button id="yNext" title="Bài sau">⏭</button>
      <button id="yMic" title="Nói tên bài hát" style="display:none">🎤</button>
      <button id="yPaste" title="Phát link YouTube đã sao chép">📋</button>
      <input id="yIn" placeholder="Gõ tên bài / ca sĩ, hoặc dán link YouTube">
      <button id="yGo">Phát</button>
      <button id="yAdd" title="Thêm vào danh sách">＋</button>
    </div>
    <div id="ytResults"></div>
    <div id="ytList"></div>
  </section>

  <!-- BẢN ĐỒ -->
  <section class="panel" id="p-map">
    <div class="map-wrap">
      <div id="gwrap"></div><div id="map" style="display:none"></div>
      <div id="mTop">
        <div id="mSearch">
          <button id="mGo" class="sbtn" title="Tìm">🔍</button>
          <input id="mIn" placeholder="Tìm ở đây" enterkeyhint="search" autocomplete="off">

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',2800); }

/* ================= BẬT / TẮT CÁC KHỐI ================= */
let shown = store.get('shown', {yt:true, map:true, clock:false, weather:false});
function applyShown(){
  for(const k of ['yt','map','clock','weather']){
    $('#p-'+k).classList.toggle('hide', !shown[k]);
    document.querySelector(`#bar [data-p=${k}]`).classList.toggle('on', !!shown[k]);

}
document.querySelectorAll('#bar [data-p]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.p, n=Object.values(shown).filter(Boolean).length;
  if(shown[k] && n===1) return;          // luôn giữ ít nhất 1 khối

applyShown();

/* bố cục */
const layouts=['auto','row','col'], layoutName={auto:'tự động',row:'chia ngang',col:'chia dọc'};

/* toàn màn hình & giữ sáng */
$('#bFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
/* ===== Giữ màn hình luôn sáng (tự động, không cần bấm) ===== */
let wake=null;
async function keepAwake(){
  try{ if(!wake && navigator.wakeLock && document.visibilityState==='visible'){ wake=await navigator.wakeLock.request('screen'); wake.onrelease=()=>{ wake=null; }; } }catch(e){}
}
keepAwake(); document.addEventListener('pointerdown',keepAwake); document.addEventListener('visibilitychange',keepAwake);

/* ===== Giao diện Sáng / Tối / Tự động (theo giờ: 6h–18h sáng, còn lại tối) ===== */
const THEMES=['auto','light','dark'], THEME_LABEL={auto:'🌗 Tự động',light:'☀️ Sáng',dark:'🌙 Tối'};
let themePref=store.get('theme','auto');
function effTheme(){ if(themePref!=='auto') return themePref; const h=new Date().getHours(); return (h>=6&&h<18)?'light':'dark'; }
let themeHook=null;

setInterval(applyTheme,60000); applyTheme();

/* ================= ĐỒNG HỒ ================= */
let h12 = store.get('h12', false);
function tick(){
  const d=new Date();
  let h=d.getHours(), suffix='';
  if(h12){ suffix=h<12?'SA':'CH'; h=h%12||12; }
  const p=n=>String(n).padStart(2,'0');
  $('#time').innerHTML = `${p(h)}:${p(d.getMinutes())}<small>${p(d.getSeconds())}${suffix?' '+suffix:''}</small>`;
  $('#date').textContent = d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  if(tick.key!==key){ tick.key=key; renderLunar(d); }
  const sec=d.getSeconds()+d.getMilliseconds()/1000, min=d.getMinutes()+sec/60, hr=(d.getHours()%12)+min/60;
  $('#hHand').style.transform=`rotate(${hr*30}deg)`;
  $('#mHand').style.transform=`rotate(${min*6}deg)`;
  $('#sHand').style.transform=`rotate(${d.getSeconds()*6}deg)`;
}

/* ---- Đồng hồ kim ---- */
(function buildAnalog(){
  const NS='http://www.w3.org/2000/svg'; let s='<circle class="face" r="96"/>';
  for(let i=0;i<60;i++){
    const a=i*6*Math.PI/180, big=i%5===0, r1=big?82:88, r2=92;
    s+=`<line class="tick${big?' h':''}" x1="${(Math.sin(a)*r1).toFixed(2)}" y1="${(-Math.cos(a)*r1).toFixed(2)}" x2="${(Math.sin(a)*r2).toFixed(2)}" y2="${(-Math.cos(a)*r2).toFixed(2)}"/>`;
  }
  for(let n=1;n<=12;n++){ const a=n*30*Math.PI/180; s+=`<text x="${(Math.sin(a)*68).toFixed(2)}" y="${(-Math.cos(a)*68).toFixed(2)}">${n}</text>`; }
  const hand=(id,len,w,cls='')=>`<g id="${id}" style="transform-origin:0 0"><line class="hand ${cls}" x1="0" y1="${len>40?14:8}" x2="0" y2="${-len}" stroke-width="${w}"/></g>`;
  s+=hand('hHand',46,5)+hand('mHand',68,3.5)+hand('sHand',76,1.5,'sec')+'<circle r="4" fill="#ffd54a"/>';
  $('#analog').innerHTML=s;
})();
let clockMode=store.get('clockMode','digital');
function applyClockMode(){
  $('#p-clock').dataset.mode=clockMode;
  $('#clockMode').textContent = clockMode==='digital' ? '🕒 Kim' : '🔢 Số';
}

applyClockMode();

/* ---- Lịch âm Việt Nam (thuật toán Hồ Ngọc Đức, múi giờ UTC+7) ---- */
const INT=Math.floor;
function jdFromDate(dd,mm,yy){
  const a=INT((14-mm)/12), y=yy+4800-a, m=mm+12*a-3;
  let jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-INT(y/100)+INT(y/400)-32045;
  if(jd<2299161) jd=dd+INT((153*m+2)/5)+365*y+INT(y/4)-32083;
  return jd;
}
function newMoon(k){
  const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180,S=x=>Math.sin(x*dr);
  let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;
  Jd1+=0.00033*S(166.56+132.87*T-0.009173*T2);
  const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3;
  const Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3;
  const F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;
  let C1=(0.1734-0.000393*T)*S(M)+0.0021*S(2*M);
  C1+=-0.4068*S(Mpr)+0.0161*S(2*Mpr)-0.0004*S(3*Mpr);
  C1+=0.0104*S(2*F)-0.0051*S(M+Mpr)-0.0074*S(M-Mpr)+0.0004*S(2*F+M);
  C1+=-0.0004*S(2*F-M)-0.0006*S(2*F+Mpr)+0.0010*S(2*F-Mpr)+0.0005*S(2*Mpr+M);
  const dt = T<-11 ? 0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3 : -0.000278+0.000265*T+0.000262*T2;
  return Jd1+C1-dt;
}
function sunLongitude(jdn){
  const T=(jdn-2451545.0)/36525,T2=T*T,dr=Math.PI/180;
  const M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2;
  const L0=280.46645+36000.76983*T+0.0003032*T2;
  let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M)+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);
  let L=(L0+DL)*dr; L-=Math.PI*2*INT(L/(Math.PI*2));
  return L;
}
const TZ=7;
const sunLong=d=>INT(sunLongitude(d-0.5-TZ/24)/Math.PI*6);
const newMoonDay=k=>INT(newMoon(k)+0.5+TZ/24);
function lunarMonth11(yy){
  const off=jdFromDate(31,12,yy)-2415021, k=INT(off/29.530588853);
  let nm=newMoonDay(k);
  if(sunLong(nm)>=9) nm=newMoonDay(k-1);
  return nm;
}
function leapOffset(a11){
  const k=INT((a11-2415021.076998695)/29.530588853+0.5);
  let last=0,i=1,arc=sunLong(newMoonDay(k+i));
  do{ last=arc; i++; arc=sunLong(newMoonDay(k+i)); }while(arc!==last && i<14);
  return i-1;
}
function solar2lunar(dd,mm,yy){
  const dayNumber=jdFromDate(dd,mm,yy);
  const k=INT((dayNumber-2415021.076998695)/29.530588853);
  let monthStart=newMoonDay(k+1);
  if(monthStart>dayNumber) monthStart=newMoonDay(k);
  let a11=lunarMonth11(yy), b11=a11, lunarYear;
  if(a11>=monthStart){ lunarYear=yy; a11=lunarMonth11(yy-1); }
  else { lunarYear=yy+1; b11=lunarMonth11(yy+1); }
  const lunarDay=dayNumber-monthStart+1, diff=INT((monthStart-a11)/29);
  let leap=0, lunarMonth=diff+11;
  if(b11-a11>365){
    const ld=leapOffset(a11);
    if(diff>=ld){ lunarMonth=diff+10; if(diff===ld) leap=1; }
  }
  if(lunarMonth>12) lunarMonth-=12;
  if(lunarMonth>=11 && diff<4) lunarYear-=1;
  return {day:lunarDay,month:lunarMonth,year:lunarYear,leap,jd:dayNumber};
}
const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
function renderLunar(d){
  try{
    const l=solar2lunar(d.getDate(),d.getMonth()+1,d.getFullYear());
    const yearName=CAN[(l.year+6)%10]+' '+CHI[(l.year+8)%12];
    const dayName =CAN[(l.jd+9)%10]+' '+CHI[(l.jd+1)%12];
    const monName =CAN[(l.year*12+l.month+3)%10]+' '+CHI[(l.month+1)%12];
    let tag=''; if(l.day===1) tag=' · Mùng một'; else if(l.day===15) tag=' · Rằm';
    $('#lunar').innerHTML=`Âm lịch: <b>${l.day}/${l.month}${l.leap?' (nhuận)':''}</b>${tag}<small>Ngày ${dayName} · tháng ${monName} · năm ${yearName}</small>`;
  }catch(e){ $('#lunar').textContent=''; }
}
$('#p-clock').onclick=()=>{ if(clockMode!=='digital') return; h12=!h12; store.set('h12',h12); tick(); };
setInterval(tick,1000); tick();

/* ================= THỜI TIẾT (Open-Meteo, miễn phí, không cần key) ================= */
function wx(code,isDay=1){
  const m={
    0:['Quang đãng', isDay?'☀️':'🌙', isDay?'clear-day':'clear-night'],
    1:['Ít mây', isDay?'🌤️':'🌙', isDay?'clear-day':'clear-night'],
    2:['Có mây', isDay?'⛅':'☁️', isDay?'cloud-day':'cloud-night'],
    3:['Nhiều mây','☁️', isDay?'cloud-day':'cloud-night'],
    45:['Sương mù','🌫️','fog'],48:['Sương mù đóng băng','🌫️','fog'],
    51:['Mưa phùn nhẹ','🌦️','rain'],53:['Mưa phùn','🌦️','rain'],55:['Mưa phùn dày','🌧️','rain'],
    56:['Mưa phùn lạnh','🌧️','rain'],57:['Mưa phùn lạnh','🌧️','rain'],
    61:['Mưa nhỏ','🌦️','rain'],63:['Mưa vừa','🌧️','rain'],65:['Mưa to','🌧️','rain'],
    66:['Mưa lạnh','🌧️','rain'],67:['Mưa lạnh to','🌧️','rain'],
    71:['Tuyết nhẹ','🌨️','snow'],73:['Tuyết','🌨️','snow'],75:['Tuyết dày','❄️','snow'],77:['Hạt tuyết','🌨️','snow'],
    80:['Mưa rào nhẹ','🌦️','rain'],81:['Mưa rào','🌧️','rain'],82:['Mưa rào rất to','🌧️','rain'],
    85:['Tuyết rào','🌨️','snow'],86:['Tuyết rào dày','❄️','snow'],
    95:['Dông','⛈️','storm'],96:['Dông kèm mưa đá','⛈️','storm'],99:['Dông mưa đá lớn','⛈️','storm']
  };
  return m[code] || ['—','🌡️','cloud-day'];
}
let loc = store.get('loc', null);   // {lat, lon, name}
function setSky(sky){
  document.body.dataset.sky = sky;
  const fx=$('#fx'); fx.className = (sky==='rain'||sky==='storm') ? 'rain' : sky==='snow' ? 'snow' : '';
}
function hourSky(){ const h=new Date().getHours(); setSky(h>=6&&h<18?'clear-day':'clear-night'); }

async function loadWeather(){
  if(!loc) return;
  $('#wLoc').textContent='📍 '+loc.name;
  const u='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon
    +'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m'
    +'&hourly=temperature_2m,precipitation_probability,weather_code,is_day'
    +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset'
    +'&timezone=auto&forecast_days=6&wind_speed_unit=kmh';
  try{
    const d=await (await fetch(u)).json(), c=d.current;
    const [txt,ico,sky]=wx(c.weather_code,c.is_day);
    $('#wIco').textContent=ico; $('#wTemp').textContent=Math.round(c.temperature_2m)+'°C'; $('#wDesc').textContent=txt;
    const sr=d.daily.sunrise[0].slice(11,16), ss=d.daily.sunset[0].slice(11,16);
    $('#wMeta').innerHTML=`<span>🌡 Cảm giác ${Math.round(c.apparent_temperature)}°</span><span>💧 ${c.relative_humidity_2m}%</span><span>💨 ${Math.round(c.wind_speed_10m)} km/h</span><span>🌅 ${sr}</span><span>🌇 ${ss}</span>`;
    setSky(sky);
    // theo giờ
    const hs=$('#wHour'); hs.innerHTML='';
    let i=d.hourly.time.findIndex(t=>t>=c.time); if(i<0) i=0;
    for(let k=i;k<i+16 && k<d.hourly.time.length;k+=2){
      const e=wx(d.hourly.weather_code[k],d.hourly.is_day[k])[1];
      hs.insertAdjacentHTML('beforeend',`<div class="cell">${d.hourly.time[k].slice(11,13)}h<div class="e">${e}</div><b>${Math.round(d.hourly.temperature_2m[k])}°</b>☔${d.hourly.precipitation_probability[k]??0}%</div>`);
    }
    // theo ngày
    const ds=$('#wDay'); ds.innerHTML='';
    for(let k=1;k<d.daily.time.length;k++){
      const dt=new Date(d.daily.time[k]+'T00:00');
      ds.insertAdjacentHTML('beforeend',`<div class="cell">${dt.toLocaleDateString('vi-VN',{weekday:'short'})}<div class="e">${wx(d.daily.weather_code[k])[1]}</div><b>${Math.round(d.daily.temperature_2m_max[k])}°</b>${Math.round(d.daily.temperature_2m_min[k])}°<br>☔${d.daily.precipitation_probability_max[k]??0}%</div>`);
    }
  }catch(e){ $('#wDesc').textContent='Không tải được thời tiết (kiểm tra mạng)'; }
}
async function nameFor(lat,lon){
  try{
    const r=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=vi`)).json();
    return r.locality || r.city || r.principalSubdivision || 'Vị trí của bạn';
  }catch(e){ return 'Vị trí của bạn'; }
}
function useGps(silent){
  if(!navigator.geolocation){ if(!silent) toast('Thiết bị không hỗ trợ định vị'); return Promise.resolve(false); }
  return new Promise(res=>navigator.geolocation.getCurrentPosition(async p=>{
    const lat=+p.coords.latitude.toFixed(4), lon=+p.coords.longitude.toFixed(4);
    loc={lat,lon,name:await nameFor(lat,lon)}; store.set('loc',loc); loadWeather(); res(true);
  },()=>{ if(!silent) toast('Không lấy được vị trí – hãy cho phép quyền định vị'); res(false); },{timeout:10000}));
}
$('#wLoc').onclick=()=>{ const r=$('#locRow'); r.style.display=r.style.display==='flex'?'none':'flex'; };
$('#wRef').onclick=loadWeather;
$('#locGps').onclick=()=>useGps(false);
async function searchLoc(){
  const q=$('#locIn').value.trim(); if(!q) return;
  try{
    const r=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=vi&name='+encodeURIComponent(q))).json();
    const box=$('#locRes'); box.innerHTML='';
    if(!r.results){ box.textContent='Không tìm thấy'; return; }
    r.results.forEach(x=>{
      const b=document.createElement('button');
      b.textContent=[x.name,x.admin1,x.country].filter(Boolean).join(', ');
      b.onclick=()=>{ loc={lat:x.latitude,lon:x.longitude,name:x.name}; store.set('loc',loc); box.innerHTML=''; $('#locRow').style.display='none'; loadWeather(); };
      box.appendChild(b);
    });
  }catch(e){ toast('Lỗi tìm địa điểm'); }
}
$('#locGo').onclick=searchLoc; $('#locIn').onkeydown=e=>{ if(e.key==='Enter') searchLoc(); };
setInterval(loadWeather, 15*60*1000);

/* ================= BẢN ĐỒ: Google Maps nhúng (xem/tìm) + dẫn đường từng ngã rẽ (OpenStreetMap + OSRM, miễn phí) ================= */

let lastPos=null, follow=true, gState={mode:'me',q:''}, gShownPos=null, gLastLoad=0, gPausedUntil=0, gWarned=false;
let lmap=null, tileLayer=null, meMarker=null, meCircle=null, destMarker=null, chgLayer=null;

  v:{url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',opt:{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap · © CARTO'}},
  d:{url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',opt:{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap · © CARTO'}},

const NOM='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=vi&q=';
function distM(a,b){
  const R=6371e3,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function bearing(a,b){
  const r=Math.PI/180, y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r), x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);
  return (Math.atan2(y,x)/r+360)%360;
}
const hereStr=()=> lastPos ? lastPos.lat+','+lastPos.lon : (loc ? loc.lat+','+loc.lon : '21.0285,105.8542');
const hereObj=()=> lastPos ? lastPos : (loc ? {lat:loc.lat,lon:loc.lon} : null);
function fmtDist(d){ if(d<1000) return Math.max(10,Math.round(d/10)*10)+' m'; return (d/1000).toFixed(1).replace('.',',')+' km'; }
function fmtMin(m){ return m>=60 ? Math.floor(m/60)+' giờ '+(m%60)+' phút' : m+' phút'; }
function hhmm(t){ return new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false}); }

function startGeo(){

/* ---------- GOOGLE MAPS (iframe nhúng) ---------- */
function gUrl(){
  const base='https://maps.google.com/maps?hl=vi&output=embed&t='+(mapSat?'k':'m'), here=hereStr();
  switch(gState.mode){
    case 'search':   return base+'&z=15&ll='+here+'&q='+encodeURIComponent(gState.q);
    case 'pin':      return base+'&z=16&q='+gState.q;
    case 'chargers': return base+'&z=13&ll='+here+'&q='+encodeURIComponent('Trạm sạc VinFast');
    default:         return base+'&z=16&q='+here;
  }
}
function gLoad(url){
  const wrap=$('#gwrap'); wrap.classList.toggle('sat',mapSat);
  const f=document.createElement('iframe'); f.className='gframe'; f.setAttribute('allowfullscreen',''); f.referrerPolicy='no-referrer-when-downgrade';
  f.style.visibility='hidden';
  const show=()=>{ f.style.visibility='visible'; wrap.querySelectorAll('iframe').forEach(o=>{ if(o!==f) o.remove(); }); };
  f.onload=show; setTimeout(show,8000);              // tải xong mới đổi khung, tránh nháy trắng
  f.src=url; wrap.appendChild(f);
  gLastLoad=Date.now(); gShownPos=lastPos?{lat:lastPos.lat,lon:lastPos.lon}:null;
  $('#mMe').classList.toggle('on',gState.mode==='me');
}
function gFollow(){
  if(engine!=='google'||!follow||!lastPos||nav) return;
  if(Date.now()<gPausedUntil) return;
  if(!gShownPos){ gLoad(gUrl()); return; }           // có GPS lần đầu: nhảy về vị trí thật
  if(gState.mode!=='me') return;
  if(distM(gShownPos,lastPos)>25 && Date.now()-gLastLoad>6000) gLoad(gUrl());
}

/* ---------- TÌM ĐỊA ĐIỂM (Photon + Nominatim, miễn phí, ưu tiên gần vị trí hiện tại) ---------- */
async function geocode(q){
  const b=hereObj(), bias=b?'&lat='+b.lat+'&lon='+b.lon:'';
  const nom=fetchJ(NOM+encodeURIComponent(q)+(b?'&viewbox='+(b.lon-.5)+','+(b.lat+.5)+','+(b.lon+.5)+','+(b.lat-.5):''),9000).then(a=>{
    if(!a.length) throw new Error('empty');
    return a.map(x=>({name:x.name||x.display_name.split(',')[0],sub:x.display_name.split(',').slice(1,3).join(',').trim(),lat:+x.lat,lon:+x.lon}));
  });
  nom.catch(()=>{});
  try{
    const j=await fetchJ('https://photon.komoot.io/api/?limit=6&q='+encodeURIComponent(q)+bias,9000), f=j.features||[];
    if(!f.length) throw new Error('empty');
    return f.map(x=>{
      const p=x.properties||{}, addr=[[p.housenumber,p.street].filter(Boolean).join(' '),p.district||p.suburb,p.city||p.county,p.state].filter(Boolean);
      return {name:p.name||addr[0]||q,sub:(p.name?addr:addr.slice(1)).join(', '),lat:x.geometry.coordinates[1],lon:x.geometry.coordinates[0]};
    });
  }catch(e){ return await nom; }
}
async function showDestinations(q){

  try{
    const items=await geocode(q), h=hereObj();
    items.forEach(x=>{ if(h) x.sub=(x.sub?x.sub+' · ':'')+fmtDist(distM(h,x)); });
    renderSheet('Kết quả cho "'+q+'"',items,'');
  }catch(e){ renderSheet('Đến đâu?',[],'Không tìm thấy "'+q+'" hoặc máy chủ tìm kiếm đang bận. Thử nói/gõ cụ thể hơn (ví dụ thêm tên đường, quận).'); }
}

/* ---------- TRẠM SẠC VINFAST (dữ liệu OpenStreetMap, không cần key) ---------- */
const VIN=/vinfast|v-green|vgreen|vin\s?fast/i;
async function fetchChargers(){
  if(!lastPos) return null;
  const key=Math.round(lastPos.lat*50)+','+Math.round(lastPos.lon*50), c=store.get('chg',null);
  if(c && c.key===key && Date.now()-c.t<6*3600e3) return c.items;
  const q='[out:json][timeout:25];(node["amenity"="charging_station"](around:25000,'+lastPos.lat+','+lastPos.lon+');way["amenity"="charging_station"](around:25000,'+lastPos.lat+','+lastPos.lon+'););out center 150;';
  const post=u=>fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
  const j=await Promise.any(['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'].map(post));
  const items=(j.elements||[]).map(e=>{
    const t=e.tags||{}, la=e.lat??(e.center&&e.center.lat), lo=e.lon??(e.center&&e.center.lon);
    return {lat:la,lon:lo,name:t.name||t.operator||t.brand||'Trạm sạc',tag:[t.name,t.operator,t.brand,t.network].join(' '),cap:t.capacity||''};
  }).filter(x=>x.lat!=null && VIN.test(x.tag)).map(x=>({...x,d:distM(lastPos,{lat:x.lat,lon:x.lon})})).sort((a,b)=>a.d-b.d).slice(0,8);
  store.set('chg',{key,t:Date.now(),items}); return items;
}

/* ================= DẪN ĐƯỜNG TỪNG NGÃ RẼ (như Google Maps) ================= */
function proj(p,a,b){   // khoảng cách (m) từ điểm p tới đoạn a-b, và vị trí t trên đoạn
  const k=Math.cos(p.lat*Math.PI/180), R=111320;
  const ax=(a[1]-p.lon)*k*R, ay=(a[0]-p.lat)*R, bx=(b[1]-p.lon)*k*R, by=(b[0]-p.lat)*R;
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let t=L2?-(ax*dx+ay*dy)/L2:0; t=Math.max(0,Math.min(1,t));
  return {d:Math.hypot(ax+t*dx,ay+t*dy),t};
}
async function fetchRoute(a,b){
  const path=a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson&steps=true&alternatives=false';
  const hosts=['https://router.project-osrm.org/route/v1/driving/','https://routing.openstreetmap.de/routed-car/route/v1/driving/'];
  const j=await Promise.any(hosts.map(h=>fetchJ(h+path,12000).then(r=>{ if(r.code!=='Ok'||!r.routes||!r.routes[0]) throw new Error('no route'); return r; })));
  const rt=j.routes[0], steps=rt.legs.flatMap(l=>l.steps), pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+distM({lat:pts[i-1][0],lon:pts[i-1][1]},{lat:pts[i][0],lon:pts[i][1]}));
  const stepStart=[]; let acc=0; steps.forEach(s=>{ stepStart.push(acc); acc+=s.distance; });
  return {pts,cum,steps,stepStart,distance:cum[cum.length-1]||rt.distance,duration:rt.duration};
}
function vnInstr(st){
  if(!st) return {text:'',ico:'↑',ang:0};
  const m=st.maneuver||{}, t=m.type, md=m.modifier||'', nm=st.name?(' vào '+st.name):'';
  const DIR={'uturn':['Quay đầu xe',180],'sharp right':['Rẽ gấp sang phải',135],'right':['Rẽ phải',90],'slight right':['Chếch sang phải',45],'straight':['Đi thẳng',0],'slight left':['Chếch sang trái',-45],'left':['Rẽ trái',-90],'sharp left':['Rẽ gấp sang trái',-135]};
  const d=DIR[md]; let text, ang=d?d[1]:0, ico='↑';
  switch(t){
    case 'depart': text='Đi về phía '+(st.name||'trước mặt'); ang=0; break;
    case 'arrive': text='Bạn sẽ đến nơi'+(md.includes('left')?' (bên trái)':md.includes('right')?' (bên phải)':''); ico='🏁'; break;
    case 'roundabout': case 'rotary': case 'roundabout turn': text='Vào vòng xuyến'+(m.exit?', ra lối thứ '+m.exit:'')+(st.name?' vào '+st.name:''); ico='⟳'; break;
    case 'merge': text='Nhập làn'+nm; break;
    case 'on ramp': text='Đi vào đường nhánh'+nm; break;
    case 'off ramp': text='Ra khỏi đường chính'+nm; break;
    case 'fork': text='Giữ làn bên '+(md.includes('left')?'trái':'phải')+nm; ang=md.includes('left')?-30:30; break;
    case 'end of road': text='Cuối đường, '+(d?d[0].toLowerCase():'rẽ')+nm; break;
    case 'continue': case 'new name': text='Đi thẳng'+(st.name?' trên '+st.name:''); break;
    default: text=(d?d[0]:'Đi tiếp')+nm;
  }
  return {text,ang,ico};
}
function setIco(el,i){ el.innerHTML=''; const s=document.createElement('span'); s.textContent=i.ico; if(i.ico==='↑') s.style.transform='rotate('+i.ang+'deg)'; el.appendChild(s); }
function say(t){
  if(!navVoice||!('speechSynthesis' in window)) return;

    const u=new SpeechSynthesisUtterance(t); u.lang='vi-VN';

    u.onstart=()=>vol(25); u.onend=()=>vol(100); u.onerror=()=>vol(100);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function drawRoute(){

    L.polyline(pts,{color:dark?'#27d3ff':'#1a73e8',weight:8,opacity:1,lineCap:'round',lineJoin:'round'})
  ]).addTo(lmap);
}
async function startNav(d,rerouting){
  if(!lastPos){ toast('Chưa có vị trí hiện tại – hãy cho phép định vị'); return; }

  let route;
  try{ route=await fetchRoute(lastPos,d); }
  catch(e){
    if(rerouting){ toast('Chưa tính lại được đường – vẫn giữ tuyến cũ'); return; }
    toast('Không tính được đường (máy chủ bản đồ bận). Thử lại, hoặc bấm G↗ để mở app Google Maps.'); return;
  }
  if(!ensureLeaflet()){ openGmaps(d); return; }
  const prev = nav ? nav.prevEngine : engine;
  nav={dest:d,route,segIdx:0,spoken:{},off:0,lastReroute:rerouting?Date.now():0,prevEngine:prev,hdg:0,prev:null,arrived:false};
  engine='osm'; applyEngine();
  $('#p-map').classList.add('navmode'); $('#lyr').style.display='none';
  if(meMarker){ lmap.removeLayer(meMarker); lmap.removeLayer(meCircle); meMarker=meCircle=null; }
  if(destMarker){ lmap.removeLayer(destMarker); destMarker=null; }

  drawRoute();
  const ll=[lastPos.lat,lastPos.lon];
  if(!carMarker) carMarker=L.marker(ll,{icon:L.divIcon({className:'carwrap',html:'<div class="car"><svg viewBox="0 0 44 44" width="46" height="46"><circle cx="22" cy="22" r="20" fill="#fff" fill-opacity=".92"/><path d="M22 6 L33 34 L22 28 L11 34 Z" fill="#1a73e8" stroke="#0b3d91" stroke-width="1.5" stroke-linejoin="round"/></svg></div>',iconSize:[46,46],iconAnchor:[23,23]}),zIndexOffset:1000,interactive:false});
  carMarker.setLatLng(ll).addTo(lmap);
  follow=true; $('#mMe').classList.add('on'); navZoomAt=0;

function stopNav(){
  if(!nav) return;
  const prev=nav.prevEngine; nav=null; clearTimeout(navIdle);
  try{ speechSynthesis.cancel(); player&&player.setVolume(100); }catch(e){}
  if(navLayer&&lmap){ lmap.removeLayer(navLayer); navLayer=null; }
  if(carMarker&&lmap) lmap.removeLayer(carMarker);
  $('#p-map').classList.remove('navmode');
  engine=prev; applyEngine(); follow=true; $('#mMe').classList.add('on');
  osmUpdateMe.first=false; if(lmap&&lastPos) osmUpdateMe(lastPos.acc||20);
}
function navTick(){
  if(!nav||!lastPos||!lmap) return;
  const R=nav.route, here=lastPos, n=R.pts.length;
  // 1) bám lên tuyến đường
  let best={d:1e9,i:0,t:0};
  const scan=(a,b)=>{ for(let i=a;i<b;i++){ const r=proj(here,R.pts[i],R.pts[i+1]); if(r.d<best.d) best={d:r.d,i,t:r.t}; } };
  scan(Math.max(0,nav.segIdx-3),Math.min(n-1,nav.segIdx+150));
  if(best.d>60) scan(0,n-1);
  nav.segIdx=best.i;
  const s=R.cum[best.i]+best.t*(R.cum[best.i+1]-R.cum[best.i]), rem=Math.max(0,R.distance-s);
  // 2) lệch đường -> tính lại
  nav.off = best.d>45 ? nav.off+1 : 0;
  if(nav.off>=3 && Date.now()-nav.lastReroute>12e3){ nav.lastReroute=Date.now(); nav.off=0; say('Đang tính lại đường'); startNav(nav.dest,true); return; }
  // 3) ngã rẽ tiếp theo
  let si=0; while(si+1<R.steps.length && R.stepStart[si+1]<=s+1) si++;
  const nxt=R.steps[si+1], dNext=nxt?Math.max(0,R.stepStart[si+1]-s):rem;
  const ins=(si===0&&s<40)?vnInstr(R.steps[0]):vnInstr(nxt);
  $('#nDist').textContent=fmtDist(dNext); $('#nInstr').textContent=ins.text; setIco($('#nIco'),ins);
  const then=R.steps[si+2]; $('#nThen').style.display=then?'inline-flex':'none'; if(then) setIco($('#nThenIco'),vnInstr(then));
  const sec=R.duration*(R.distance?rem/R.distance:0), min=Math.max(1,Math.round(sec/60));
  $('#nMin').textContent=fmtMin(min); $('#nSub').textContent=fmtDist(rem)+' · '+hhmm(Date.now()+sec*1000);
  const kmh=here.spd!=null&&!isNaN(here.spd)?Math.round(here.spd*3.6):0; $('#nSpeed b').textContent=kmh;
  // 4) giọng nói
  if(nxt){
    const k1=si+':300', k2=si+':80', words=vnInstr(nxt).text, lf=t=>t.charAt(0).toLowerCase()+t.slice(1);
    if(dNext<=300 && dNext>110 && !nav.spoken[k1]){ nav.spoken[k1]=1; say('Sau '+(Math.round(dNext/50)*50)+' mét, '+lf(words)); }
    if(dNext<=80 && !nav.spoken[k2]){ nav.spoken[k2]=1; nav.spoken[k1]=1; say(words); }
  }
  // 5) đến nơi
  if(rem<35 && !nav.arrived){ nav.arrived=true; say('Bạn đã đến nơi'); toast('🏁 Bạn đã đến nơi'); setTimeout(stopNav,6000); }
  // 6) xe và camera
  const ll=[here.lat,here.lon];
  let h=nav.hdg;
  if(here.hdg!=null && !isNaN(here.hdg) && (here.spd||0)>1.5) h=here.hdg;
  else if(nav.prev && distM(nav.prev,here)>6){ h=bearing(nav.prev,here); }
  if(!nav.prev || distM(nav.prev,here)>6) nav.prev={lat:here.lat,lon:here.lon};
  nav.hdg=h;
  carMarker.setLatLng(ll);
  const el=carMarker.getElement(); if(el&&el.firstChild) el.firstChild.style.transform='rotate('+h+'deg)';
  if(follow){
    const spd=(here.spd||0)*3.6, wantZ=spd<25?18:spd<55?17:spd<85?16:15;
    if(wantZ!==lmap.getZoom() && Date.now()-navZoomAt>10e3){ navZoomAt=Date.now(); lmap.setZoom(wantZ,{animate:true}); }
    const z=lmap.getZoom(), pt=lmap.project(L.latLng(ll),z), off=lmap.getSize().y*0.18, r=h*Math.PI/180;
    pt.x+=Math.sin(r)*off; pt.y-=Math.cos(r)*off;
    lmap.panTo(lmap.unproject(pt,z),{animate:true,duration:.9,easeLinearity:1});
  }
}

/* ---- Tìm kiếm / thịnh hành KHÔNG cần API key: hỏi song song nhiều máy chủ công cộng, máy nào trả lời trước thì dùng ---- */
const PIPED=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.private.coffee'];
const INVID=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de'];
function fetchJ(url,ms=8000){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).finally(()=>clearTimeout(t));
}
function fromPiped(j){
  const a=Array.isArray(j)?j:(j&&j.items)||[];
  return a.filter(x=>x.url&&x.url.includes('/watch?v=')&&!x.isShort).map(x=>({type:'video',id:x.url.split('v=')[1].slice(0,11),title:x.title}));
}
function fromInv(a){
  return (Array.isArray(a)?a:[]).filter(x=>x.videoId&&(!x.type||x.type==='video')&&!(x.lengthSeconds>0&&x.lengthSeconds<65)).map(x=>({type:'video',id:x.videoId,title:x.title}));
}
function anyBackend(pPath,iPath){
  const tasks=[...PIPED.map(b=>fetchJ(b+pPath).then(fromPiped)),...INVID.map(b=>fetchJ(b+iPath).then(fromInv))]
    .map(t=>t.then(r=>{ if(!r.length) throw new Error('empty'); return r; }));
  return Promise.any(tasks);
}
function kSearch(q){ const e=encodeURIComponent(q); return anyBackend('/search?q='+e+'&filter=videos','/api/v1/search?q='+e+'&type=video&region=VN'); }
async function kTrending(){
  try{ return await anyBackend('/trending?region=VN','/api/v1/trending?region=VN&type=music'); }
  catch(e){ return await kSearch('nhạc trẻ hay nhất'); }
}
async function cachedSearch(q){
  const key=q.trim().toLowerCase(), all=store.get('scache',{}), hit=all[key];
  if(hit && Date.now()-hit.t<12*3600e3) return hit.items;
  try{
    const items=await kSearch(q);
    all[key]={t:Date.now(),items};
    const ks=Object.keys(all); if(ks.length>15) ks.sort((a,b)=>all[a].t-all[b].t).slice(0,ks.length-15).forEach(k=>delete all[k]);
    store.set('scache',all); return items;
  }catch(e){ if(hit) return hit.items; throw e; }   // máy chủ bận: dùng kết quả cũ nếu có
}

}
function parseYT(s){
  s=s.trim();
  try{
    const u=new URL(s), list=u.searchParams.get('list');
    let v=u.searchParams.get('v');
    if(!v && u.hostname.includes('youtu.be')) v=u.pathname.slice(1);
    if(!v){ const m=u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/); if(m) v=m[2]; }
    if(v) return {type:'video',id:v.slice(0,11)};
    if(list) return {type:'playlist',id:list};
  }catch(e){}
  if(/^[\w-]{11}$/.test(s)) return {type:'video',id:s};
  if(/^(PL|UU|OL|RD|FL)[\w-]{10,}$/.test(s)) return {type:'playlist',id:s};
  return null;
}

async function fillTitles(ids){

    catch(e){ titleCache[id]='YouTube video'; }
    if(n%5===0){ store.set('titles',titleCache); renderQueue(); }
  }
  store.set('titles',titleCache); renderQueue();

function renderQueue(){

window.onYouTubeIframeAPIReady=()=>{
  const pv={playsinline:1,rel:0,modestbranding:1};
  if(/^https?:$/.test(location.protocol)) pv.origin=location.origin;
  player=new YT.Player('player',{
    width:'100%',height:'100%',
    playerVars:pv,
    events:{
      onReady:()=>{
        ready=true; setupMedia();
        if(pending!==null){ const i=pending; pending=null; play(i); }
        else restoreYT();
      },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.ENDED) nextItem();
        if(e.data===YT.PlayerState.PLAYING){
          ytMsg('');
          const it=list[cur];
          if(it && it.type==='playlist'){
            try{ const ids=player.getPlaylist(); if(ids && ids.length && ids.join()!==plIds.join()){ plIds=ids; fillTitles(ids); } }catch(err){}
          }
          renderQueue();
        }
      },
      onError:e=>{
        const c=e.data;
        const why={2:'Link / ID video không hợp lệ.',5:'Trình phát HTML5 gặp lỗi.',100:'Video đã bị xóa hoặc để riêng tư.',
          101:'Chủ video tắt nhúng nên không phát được ở đây.',150:'Chủ video tắt nhúng nên không phát được ở đây.',
          153:'Thiếu thông tin nguồn (referrer). Hãy mở trang qua https/hosting thật, không mở file trực tiếp, và đừng đặt header <code>Referrer-Policy: no-referrer</code>.'}[c]||'Lỗi không xác định.';
        ytMsg(`⚠ Lỗi ${c}: ${why}<br>${ytOpenLink()}`);

      }

async function restoreYT(){
  let it=list[cur];
  if(!it){
    if(!autoplay){ openHome(); return; }

  }
  const pos=store.get('ypos',null), same=pos&&pos.id===it.id;
  const t=same?pos.t:0, idx=same?(pos.idx||0):0;
  plIds=[];
  try{
    if(autoplay){
      // Trình duyệt thường chỉ cho tự phát khi tắt tiếng; chạm màn hình lần đầu sẽ bật tiếng
      player.mute(); closeHome();
      if(it.type==='playlist') player.loadPlaylist({list:it.id,listType:'playlist',index:idx,startSeconds:t});
      else player.loadVideoById({videoId:it.id,startSeconds:t});
      toast('Đang tự phát (tắt tiếng) – chạm vào màn hình để bật tiếng');

    }else{
      if(it.type==='playlist') player.cuePlaylist({list:it.id,listType:'playlist',index:idx,startSeconds:t});
      else player.cueVideoById({videoId:it.id,startSeconds:t});
      toast('Đã mở lại bài đang nghe – chạm ▶ để phát tiếp');
    }
  }catch(e){}
}
setInterval(()=>{

      store.set('ypos',o);
    }

function play(i){
  if(i<0||i>=list.length) return;

  if(!ready){ pending=i; return; }

let advancing=false;
async function nextItem(){
  if(!list.length||advancing) return; advancing=true;
  try{
    if(cur>=list.length-1){   // hết danh sách: nạp thêm bài liên quan để nhạc không bị dừng
      const it=list[cur], base=(it&&(it.title||titleCache[it.id]))||'nhạc trẻ hay nhất';
      try{
        const have=new Set(list.map(x=>x.id));
        const add=(await cachedSearch(base)).filter(x=>!have.has(x.id)).slice(0,15);
        if(add.length){ list.push(...add); save(); renderList(); }
      }catch(e){}
    }
    play((cur+1)%list.length);
  }finally{ advancing=false; }
}
$('#yNext').onclick=()=>{
  const it=list[cur];
  if(it && it.type==='playlist' && ready) player.nextVideo(); else nextItem();
};
$('#yPrev').onclick=()=>{
  const it=list[cur];
  if(it && it.type==='playlist' && ready) player.previousVideo(); else if(list.length) play((cur-1+list.length)%list.length);
};

async function fetchTitle(it){
  const url = it.type==='playlist' ? 'https://www.youtube.com/playlist?list='+it.id : 'https://www.youtube.com/watch?v='+it.id;
  try{
    const r=await (await fetch('https://noembed.com/embed?url='+encodeURIComponent(url))).json();
    it.title = r.title || (it.type==='playlist'?'Playlist '+it.id:it.id);
  }catch(e){ it.title = it.type==='playlist'?'Playlist '+it.id:it.id; }
  save(); renderList();
}
function addItem(it, andPlay){
  let idx=list.findIndex(x=>x.id===it.id);
  if(idx<0){ list.push(it); idx=list.length-1; if(!it.title) fetchTitle(it); }
  save(); renderList();
  if(andPlay) play(idx);
}
function searchYT(q){ return playSearch(q); }
$('#yGo').onclick=()=>{
  const s=$('#yIn').value.trim(); if(!s) return;
  const it=parseYT(s);
  if(it){ addItem(it,true); $('#yIn').value=''; $('#ytResults').innerHTML=''; } else searchYT(s);
};
$('#yAdd').onclick=()=>{
  const it=parseYT($('#yIn').value); if(!it){ toast('Link / ID không hợp lệ'); return; }
  addItem(it,false); $('#yIn').value='';
};
$('#yIn').onkeydown=e=>{ if(e.key==='Enter') $('#yGo').click(); };
$('#yPlay').onclick=()=>{
  if(!list[cur]){ restoreYT(); return; }
  try{ player.getPlayerState()===1 ? player.pauseVideo() : player.playVideo(); }catch(e){}
};
$('#yPaste').onclick=async()=>{
  try{
    const it=parseYT(await navigator.clipboard.readText());
    if(it) addItem(it,true); else toast('Chưa có link YouTube trong bộ nhớ tạm – hãy sao chép link trước');
  }catch(e){ toast('Trình duyệt không cho đọc bộ nhớ tạm – hãy dán vào ô rồi bấm Phát'); }
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  $('#yMic').style.display='';
  $('#yMic').onclick=()=>{
    try{
      const r=new SR(); r.lang='vi-VN'; r.maxAlternatives=1;
      r.onresult=e=>{ const q=e.results[0][0].transcript; $('#yIn').value=q; playSearch(q); };
      r.onerror=()=>toast('Không nghe được – thử lại');
      r.start(); toast('🎤 Đang nghe… hãy nói tên bài hát hoặc ca sĩ');
    }catch(e){ toast('Thiết bị không hỗ trợ nhận giọng nói'); }
  };
}
if(SR){
  $('#mMic').style.display='';
  $('#mMic').onclick=()=>{
    try{
      const r=new SR(); r.lang='vi-VN'; r.maxAlternatives=1;
      r.onresult=e=>{ const q=e.results[0][0].transcript, m=q.match(/^(chỉ đường|dẫn đường|đường|đi)\s+(đến|tới|đi)?\s*(.+)/i); $('#mIn').value=m?m[3]:q; if(m){ setChip(''); showDestinations(m[3]); } else mapSearch(q); };
      r.onerror=()=>toast('Không nghe được – thử lại');
      r.start(); toast('🎤 Hãy nói nơi cần đến');
    }catch(e){ toast('Thiết bị không hỗ trợ nhận giọng nói'); }
  };
}
// Phím media (tai nghe / vô-lăng / Bluetooth), nếu trình duyệt cho phép
function setupMedia(){
  if(!('mediaSession' in navigator)) return;
  const set=(a,f)=>{ try{ navigator.mediaSession.setActionHandler(a,f); }catch(e){} };
  set('play',()=>{ try{ player.playVideo(); }catch(e){} });
  set('pause',()=>{ try{ player.pauseVideo(); }catch(e){} });
  set('nexttrack',()=>$('#yNext').click());
  set('previoustrack',()=>$('#yPrev').click());
}
$('#yHome').onclick=()=>{ $('#home').classList.contains('open') ? closeHome() : openHome(); };

/* ================= KHỞI ĐỘNG ================= */
renderList(); emptyHint(); loadYT();
if(!list[cur] && !autoplay) openHome();   // tự phát tắt + chưa có bài -> hiện Trang chủ
hourSky();

  if(!loc){
    const ok = await useGps(true);
