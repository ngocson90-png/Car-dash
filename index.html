<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Car Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Routing Machine & Geocoder -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
        @import url('https://fonts.cdnfonts.com/css/eurostile');
        
        body {
            font-family: 'Eurostile', 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
        }

        .font-digital {
            font-family: 'Eurostile', 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Dark mode map styling filter */
        .dark-mode-map {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .leaflet-routing-container {
            background-color: rgba(30, 41, 59, 0.95) !important;
            color: #f8fafc !important;
            border-radius: 0.75rem !important;
            padding: 10px !important;
            max-height: 40vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .leaflet-routing-container input {
            background-color: #334155 !important;
            color: white !important;
            border: 1px solid #475569 !important;
            border-radius: 0.5rem;
            padding: 5px 10px;
        }
        .leaflet-routing-alt {
            background-color: transparent !important;
            border-bottom: 1px solid rgba(255,255,255,0.1) !important;
        }
        .leaflet-routing-alt h2 { color: #38bdf8 !important; font-size: 1rem; }
        .leaflet-routing-alt h3 { color: #94a3b8 !important; }
        .leaflet-bar a {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        
        #map { width: 100%; height: 100%; z-index: 10; }
        #loading { transition: opacity 0.5s ease-out; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-screen">

    <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white">
        <i class="fa-solid fa-car-side text-6xl animate-bounce mb-4 text-sky-400"></i>
        <h1 class="text-2xl font-bold font-digital">Khởi động hệ thống...</h1>
        <p class="text-slate-400 mt-2">Đang tìm tín hiệu GPS</p>
    </div>

    <!-- Sidebar / Left Panel (Split 50/50 halves) -->
    <div class="glass-panel w-full md:w-[380px] lg:w-[420px] h-2/5 md:h-full flex flex-col p-3 gap-3 z-20 shadow-2xl relative order-2 md:order-1 overflow-y-auto">
        
        <!-- NỬA TRÊN: Khung đồng hồ & Lịch âm dương siêu lớn -->
        <div class="glass-card flex flex-col justify-between items-center p-4 min-h-[220px] cursor-pointer hover:bg-slate-800/60 transition-colors border-sky-500/30 flex-none" onclick="toggleClock()" title="Chạm để chuyển đổi kiểu đồng hồ">
            
            <!-- Đồng hồ số (Mặc định to) -->
            <div id="digital-view" class="flex flex-col items-center w-full">
                <h1 id="clock" class="text-6xl lg:text-7xl leading-none font-digital font-bold text-transparent bg-clip-text bg-gradient-to-b from-white via-sky-200 to-sky-500 drop-shadow-[0_0_20px_rgba(14,165,233,0.4)] tracking-wide">
                    --:--
                </h1>
            </div>

            <!-- Đồng hồ kim (Ẩn mặc định) -->
            <div id="analog-view" class="hidden flex-col items-center w-full">
                <div class="relative w-[120px] h-[120px] rounded-full flex-none border-[4px] border-sky-500/60 bg-slate-900 shadow-[inset_0_0_30px_rgba(0,0,0,0.9),0_0_20px_rgba(14,165,233,0.3)]">
                    <div class="absolute top-2 left-[57px] w-[2px] h-[10px] bg-sky-400"></div>
                    <div class="absolute bottom-2 left-[57px] w-[2px] h-[10px] bg-sky-400"></div>
                    <div class="absolute top-[57px] left-2 w-[10px] h-[2px] bg-sky-400"></div>
                    <div class="absolute top-[57px] right-2 w-[10px] h-[2px] bg-sky-400"></div>

                    <div id="hour-hand" class="absolute bg-white rounded-full shadow-md" style="width:5px; height:35px; top:25px; left:56px; transform-origin: bottom;"></div>
                    <div id="minute-hand" class="absolute bg-slate-300 rounded-full shadow-md" style="width:3px; height:48px; top:12px; left:57px; transform-origin: bottom;"></div>
                    <div id="second-hand" class="absolute bg-red-500 rounded-full" style="width:1px; height:52px; top:8px; left:58px; transform-origin: bottom;"></div>
                    <div class="absolute bg-sky-400 rounded-full shadow-[0_0_10px_#fff] z-10" style="width:10px; height:10px; top:54px; left:54px;"></div>
                </div>
            </div>
            
            <!-- Ngày Dương & Âm Lịch (Cực lớn và rõ ràng) -->
            <div class="flex flex-col items-center text-center w-full border-t border-slate-700/50 pt-3 mt-2">
                <p id="date-solar" class="text-base lg:text-lg font-bold text-slate-100 tracking-wide">
                    Đang tải ngày...
                </p>
                <div class="flex items-center justify-center gap-2 mt-2 px-4 py-1.5 bg-slate-900/90 rounded-full border border-sky-500/40 shadow-inner w-full">
                    <i class="fa-solid fa-moon text-yellow-300 text-sm"></i>
                    <p id="date-lunar" class="text-sm lg:text-base text-sky-200 font-semibold font-digital">
                        --/--
                    </p>
                </div>
            </div>
        </div>

        <!-- Thời tiết & Vận tốc (Nhỏ gọn, nằm ngang) -->
        <div class="grid grid-cols-2 gap-2 flex-none">
            <!-- Weather Widget -->
            <div class="glass-card p-2.5 flex flex-row items-center justify-between gap-2">
                <div id="weather-icon" class="text-2xl text-sky-400 w-8 text-center">
                    <i class="fa-solid fa-cloud-sun"></i>
                </div>
                <div class="text-right flex-1 min-w-0">
                    <div id="weather-temp" class="text-xl font-bold font-digital">--°C</div>
                    <div id="weather-desc" class="text-[9px] text-slate-400 uppercase tracking-wider truncate">Đang tải</div>
                </div>
            </div>

            <!-- Speedometer Widget -->
            <div class="glass-card p-2.5 flex flex-row items-center justify-between gap-2">
                <div class="text-2xl text-green-400 w-8 text-center">
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <div class="text-right flex-1 min-w-0">
                    <div id="speed" class="text-xl font-bold font-digital">0<span class="text-[9px] ml-0.5">km/h</span></div>
                    <div id="heading" class="text-[9px] text-slate-400 uppercase tracking-wider truncate">Hướng: --</div>
                </div>
            </div>
        </div>

        <!-- EV Charging Alarm Widget -->
        <div class="glass-card flex-none p-2.5 flex items-center justify-between bg-gradient-to-r from-sky-900/40 to-transparent">
            <div class="flex items-center gap-2 text-sky-400">
                <i id="alarm-icon" class="fa-solid fa-bolt text-base"></i>
                <div class="flex flex-col">
                    <span class="text-[9px] font-semibold text-slate-300 uppercase tracking-wider">Hẹn giờ sạc pin</span>
                    <span id="alarm-display" class="text-base text-white font-digital">--:--:--</span>
                </div>
            </div>
            <div>
                <button onclick="openAlarmModal()" id="btn-set-alarm" class="text-[9px] bg-sky-500 hover:bg-sky-400 text-white px-2.5 py-1 rounded transition-colors shadow">
                    <i class="fa-solid fa-stopwatch"></i> Cài đặt
                </button>
                <button onclick="cancelAlarm()" id="btn-cancel-alarm" class="hidden text-[9px] bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/50 px-2.5 py-1 rounded transition-colors shadow">
                    <i class="fa-solid fa-xmark"></i> Hủy
                </button>
            </div>
        </div>

        <!-- NỬA DƯỚI: Lịch tháng trực quan (Dương & Âm) -->
        <div class="glass-card flex-1 flex flex-col p-3 overflow-hidden min-h-[220px]">
            <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-700/50">
                <button onclick="changeMonth(-1)" class="w-6 h-6 bg-slate-800 hover:bg-sky-600 rounded text-white flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="calendar-month-title" class="text-xs lg:text-sm font-bold text-sky-300 font-digital">Tháng --/----</h3>
                <button onclick="changeMonth(1)" class="w-6 h-6 bg-slate-800 hover:bg-sky-600 rounded text-white flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            
            <!-- Header Thứ trong tuần -->
            <div class="grid grid-cols-7 text-center text-[10px] text-slate-400 font-semibold mb-1">
                <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span class="text-red-400">CN</span>
            </div>

            <!-- Các ô ngày trong tháng -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 flex-1 overflow-y-auto" style="scrollbar-width: thin; scrollbar-color: #475569 transparent;">
                <!-- Render bằng JavaScript -->
            </div>
        </div>

        <!-- System Status -->
        <div class="flex-none pt-1 border-t border-slate-700/50 flex justify-between items-center text-[9px] text-slate-500">
            <div class="flex items-center gap-1.5">
                <div id="gps-indicator" class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
                <span id="gps-status">Chờ GPS...</span>
            </div>
            <button onclick="centerMapOnUser()" class="px-2 py-0.5 bg-sky-500/20 hover:bg-sky-500/40 text-sky-400 rounded transition-colors flex items-center gap-1">
                <i class="fa-solid fa-location-crosshairs"></i> Về vị trí xe
            </button>
        </div>
    </div>

    <!-- Right Panel (Map View) -->
    <div class="w-full md:flex-1 h-3/5 md:h-full relative order-1 md:order-2 bg-slate-800">
        <div id="map"></div>
    </div>

    <!-- Alarm Setup Modal -->
    <div id="alarm-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm transition-opacity">
        <div class="glass-card p-6 border border-sky-500/50 w-80 max-w-[90%] text-center shadow-[0_0_40px_rgba(14,165,233,0.2)]">
            <i class="fa-solid fa-battery-three-quarters text-4xl text-sky-400 mb-3"></i>
            <h2 class="text-lg font-bold font-digital text-white mb-1">THIẾT LẬP HẸN GIỜ SẠC</h2>
            <p class="text-xs text-slate-400 mb-4">Nhắc nhở khi sạc xong pin ô tô</p>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="startAlarm(30)" class="py-2 bg-slate-700/80 hover:bg-sky-600 rounded text-sm text-white font-bold transition border border-slate-600">30 Phút</button>
                <button onclick="startAlarm(60)" class="py-2 bg-slate-700/80 hover:bg-sky-600 rounded text-sm text-white font-bold transition border border-slate-600">1 Giờ</button>
                <button onclick="startAlarm(120)" class="py-2 bg-slate-700/80 hover:bg-sky-600 rounded text-sm text-white font-bold transition border border-slate-600">2 Giờ</button>
                <button onclick="startAlarm(240)" class="py-2 bg-slate-700/80 hover:bg-sky-600 rounded text-sm text-white font-bold transition border border-slate-600">4 Giờ</button>
            </div>
            <div class="flex gap-2 justify-center mt-2">
                <input type="number" id="custom-alarm-val" placeholder="Số phút" class="w-1/2 p-2 bg-slate-800/80 border border-slate-600 rounded text-white text-sm outline-none text-center font-digital focus:border-sky-400">
                <button onclick="startCustomAlarm()" class="w-1/2 p-2 bg-sky-500 hover:bg-sky-400 rounded text-sm text-white font-bold transition shadow-lg shadow-sky-500/20">Bắt đầu</button>
            </div>
            <button onclick="closeAlarmModal()" class="mt-5 text-xs text-slate-400 hover:text-white underline">Đóng cửa sổ</button>
        </div>
    </div>

    <!-- Alarm Trigger Alert Modal -->
    <div id="alarm-trigger-modal" class="hidden fixed inset-0 z-[110] flex flex-col items-center justify-center bg-red-950/90 backdrop-blur-md">
        <i class="fa-solid fa-bell text-7xl text-yellow-300 animate-[ping_1s_infinite] mb-6"></i>
        <h1 class="text-5xl font-bold font-digital text-white mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]">ĐÃ SẠC XONG!</h1>
        <p class="text-slate-300 mb-10 text-lg">Thời gian hẹn giờ sạc pin đã kết thúc.</p>
        <button onclick="stopAlarmSound()" class="px-8 py-4 bg-red-600 hover:bg-red-500 border-2 border-red-400 rounded-full text-white font-bold text-lg shadow-[0_0_30px_rgba(239,68,68,0.8)] transition-all transform hover:scale-105 flex items-center gap-2">
            <i class="fa-solid fa-power-off"></i> TẮT BÁO THỨC
        </button>
    </div>

    <script>
        // Bắt lỗi ngầm từ bên thứ 3
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.name === 'TypeError' && event.reason.message === 'Failed to fetch') {
                event.preventDefault();
            }
        });

        // --- 1. CLOCK & LUNAR LOGIC ---
        let isDigitalClock = true;

        function toggleClock() {
            isDigitalClock = !isDigitalClock;
            const digitalView = document.getElementById('digital-view');
            const analogView = document.getElementById('analog-view');
            
            if (isDigitalClock) {
                digitalView.classList.remove('hidden');
                digitalView.classList.add('flex');
                analogView.classList.add('hidden');
                analogView.classList.remove('flex');
            } else {
                digitalView.classList.add('hidden');
                digitalView.classList.remove('flex');
                analogView.classList.remove('hidden');
                analogView.classList.add('flex');
            }
        }

        function updateTime() {
            const now = new Date();
            
            // Digital Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Analog Hands
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            document.getElementById('hour-hand').style.transform = `rotate(${(h % 12) * 30 + m * 0.5}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
            document.getElementById('second-hand').style.transform = `rotate(${s * 6}deg)`;

            // Solar Date
            const optionsSolar = { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric' };
            document.getElementById('date-solar').textContent = now.toLocaleDateString('vi-VN', optionsSolar);

            // Lunar Date String
            try {
                const formatter = new Intl.DateTimeFormat('vi-VN-u-ca-chinese', { day: 'numeric', month: 'numeric' });
                let lunarStr = formatter.format(now).replace(/ngày|tháng/g, '').trim().replace(/\s+/g, '/');
                document.getElementById('date-lunar').textContent = `Âm lịch: ${lunarStr}`;
            } catch (e) {
                document.getElementById('date-lunar').textContent = "Âm lịch: --/--";
            }
        }
        
        setInterval(updateTime, 1000);
        updateTime();

        // --- 2. MONTHLY CALENDAR LOGIC (Dương & Âm) ---
        let viewDate = new Date();

        function renderMonthlyCalendar() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            
            document.getElementById('calendar-month-title').textContent = `Tháng ${month + 1} / ${year}`;
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Thứ 2 là 0
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Các ô trống đầu tháng
            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div></div>`;
            }

            // Render các ngày trong tháng
            const chineseFormatter = new Intl.DateTimeFormat('vi-VN-u-ca-chinese', { day: 'numeric', month: 'numeric' });

            for (let day = 1; day <= totalDays; day++) {
                const curr = new Date(year, month, day);
                const isToday = curr.getDate() === today.getDate() && curr.getMonth() === today.getMonth() && curr.getFullYear() === today.getFullYear();
                
                let lunarDayStr = '';
                try {
                    let parts = chineseFormatter.format(curr).split(' ');
                    lunarDayStr = parts[1] || parts[0]; // Lấy ngày âm
                } catch(e) { lunarDayStr = ''; }

                grid.innerHTML += `
                    <div class="flex flex-col items-center justify-center p-1 rounded ${isToday ? 'bg-sky-500 text-white font-bold shadow-lg shadow-sky-500/30' : 'bg-slate-800/50 hover:bg-slate-700/60 text-slate-200'} transition">
                        <span class="text-xs font-digital">${day}</span>
                        <span class="text-[8px] ${isToday ? 'text-sky-100' : 'text-sky-400'}">${lunarDayStr}</span>
                    </div>
                `;
            }
        }

        function changeMonth(direction) {
            viewDate.setMonth(viewDate.getMonth() + direction);
            renderMonthlyCalendar();
        }

        renderMonthlyCalendar();

        // --- 3. MAP & GEOLOCATION LOGIC ---
        let map, userMarker, routingControl;
        let isFirstLocation = true;
        let currentLat = null, currentLng = null;

        const carIcon = L.divIcon({
            html: '<div class="bg-sky-500 rounded-full w-6 h-6 border-4 border-white shadow-[0_0_15px_rgba(14,165,233,0.8)] flex items-center justify-center animate-pulse"></div>',
            className: 'car-marker',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([16.047079, 108.206230], 6);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // OpenStreetMap tile layer with Dark Mode CSS filter
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19,
                className: 'dark-mode-map'
            }).addTo(map);

            map.on('click', function(e) {
                if (currentLat && currentLng && routingControl) {
                    routingControl.setWaypoints([
                        L.latLng(currentLat, currentLng),
                        e.latlng
                    ]);
                }
            });
        }

        initMap();

        function centerMapOnUser() {
            if (currentLat && currentLng && map) {
                map.setView([currentLat, currentLng], 17);
            }
        }

        function setupRouting(startLat, startLng) {
            if (routingControl) return;

            routingControl = L.Routing.control({
                waypoints: [L.latLng(startLat, startLng), null],
                routeWhileDragging: false,
                geocoder: L.Control.Geocoder.photon(),
                language: 'en',
                showAlternatives: true,
                fitSelectedRoutes: true,
                lineOptions: { styles: [{color: '#0ea5e9', opacity: 0.8, weight: 7}] },
                createMarker: function(i, wp) {
                    if (i === 0) return null;
                    return L.marker(wp.latLng, {
                        icon: L.divIcon({
                            html: '<i class="fa-solid fa-location-dot text-3xl text-red-500 drop-shadow-md"></i>',
                            className: 'dest-marker',
                            iconSize: [30, 30],
                            iconAnchor: [15, 30]
                        })
                    });
                }
            }).addTo(map);

            routingControl.getContainer().classList.add('glass-panel');
        }

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const speed = position.coords.speed;
                    const heading = position.coords.heading;

                    currentLat = lat; currentLng = lng;

                    if (isFirstLocation) {
                        document.getElementById('loading').style.opacity = '0';
                        setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
                        map.setView([lat, lng], 17);
                        fetchWeather(lat, lng);
                        setupRouting(lat, lng);
                        isFirstLocation = false;
                    }

                    document.getElementById('gps-indicator').classList.remove('bg-red-500');
                    document.getElementById('gps-indicator').classList.add('bg-green-500');
                    document.getElementById('gps-status').textContent = 'GPS Đã kết nối';

                    if (!userMarker) {
                        userMarker = L.marker([lat, lng], {icon: carIcon}).addTo(map);
                    } else {
                        userMarker.setLatLng([lat, lng]);
                    }

                    if (routingControl && routingControl.getWaypoints().length > 0) {
                        const waypoints = routingControl.getWaypoints();
                        waypoints[0].latLng = L.latLng(lat, lng);
                        routingControl.setWaypoints(waypoints);
                    }

                    if (speed !== null && speed >= 0) {
                        document.getElementById('speed').innerHTML = `${(speed * 3.6).toFixed(0)} <span class="text-[9px] text-slate-400">km/h</span>`;
                    }
                    if (heading !== null && !isNaN(heading)) {
                        const dirs = ['Bắc', 'ĐB', 'Đông', 'ĐN', 'Nam', 'TN', 'Tây', 'TB', 'Bắc'];
                        document.getElementById('heading').textContent = `Hướng: ${dirs[Math.round(heading / 45)]}`;
                    }
                },
                () => {
                    if (isFirstLocation) {
                        document.getElementById('loading').style.opacity = '0';
                        setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
                        const mockLat = 10.762622, mockLng = 106.660172;
                        currentLat = mockLat; currentLng = mockLng;
                        map.setView([mockLat, mockLng], 15);
                        userMarker = L.marker([mockLat, mockLng], {icon: carIcon}).addTo(map);
                        fetchWeather(mockLat, mockLng);
                        setupRouting(mockLat, mockLng);
                        isFirstLocation = false;
                        document.getElementById('gps-status').textContent = 'Chế độ Demo (HCM)';
                    }
                },
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
        }

        // --- 4. WEATHER LOGIC ---
        async function fetchWeather(lat, lng) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
                const data = await res.json();
                const current = data.current_weather;
                document.getElementById('weather-temp').textContent = `${Math.round(current.temperature)}°C`;
                
                let icon = "fa-sun", desc = "Nắng", color = "text-yellow-400";
                if(current.weathercode >= 1 && current.weathercode <= 3) { icon = "fa-cloud-sun"; desc = "Mây"; color = "text-sky-400"; }
                else if(current.weathercode >= 51) { icon = "fa-cloud-rain"; desc = "Mưa"; color = "text-blue-400"; }

                const iconEl = document.getElementById('weather-icon');
                iconEl.innerHTML = `<i class="fa-solid ${icon}"></i>`;
                iconEl.className = `text-2xl w-8 text-center ${color}`;
                document.getElementById('weather-desc').textContent = desc;
            } catch (e) {
                document.getElementById('weather-desc').textContent = "Lỗi thời tiết";
            }
        }

        // --- 5. ALARM & TIMER LOGIC ---
        let alarmEndTime = null, alarmTimerId = null, audioCtx = null, beepInterval = null;

        function openAlarmModal() {
            document.getElementById('alarm-modal').classList.remove('hidden');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function closeAlarmModal() { document.getElementById('alarm-modal').classList.add('hidden'); }
        function startCustomAlarm() {
            const val = parseInt(document.getElementById('custom-alarm-val').value);
            if(val && val > 0) startAlarm(val);
        }
        function startAlarm(minutes) {
            closeAlarmModal();
            alarmEndTime = new Date().getTime() + minutes * 60000;
            document.getElementById('btn-set-alarm').classList.add('hidden');
            document.getElementById('btn-cancel-alarm').classList.remove('hidden');
            document.getElementById('alarm-icon').classList.add('animate-pulse', 'text-yellow-400');
            
            if(alarmTimerId) clearInterval(alarmTimerId);
            alarmTimerId = setInterval(updateAlarmDisplay, 1000);
            updateAlarmDisplay();
        }
        function cancelAlarm() {
            alarmEndTime = null;
            if(alarmTimerId) clearInterval(alarmTimerId);
            document.getElementById('alarm-display').textContent = "--:--:--";
            document.getElementById('btn-set-alarm').classList.remove('hidden');
            document.getElementById('btn-cancel-alarm').classList.add('hidden');
            document.getElementById('alarm-icon').classList.remove('animate-pulse', 'text-yellow-400');
        }
        function updateAlarmDisplay() {
            if(!alarmEndTime) return;
            const diff = alarmEndTime - new Date().getTime();
            if(diff <= 0) { cancelAlarm(); triggerAlarmAlert(); return; }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('alarm-display').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        function triggerAlarmAlert() {
            document.getElementById('alarm-trigger-modal').classList.remove('hidden');
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            playBeep(); beepInterval = setInterval(playBeep, 1000);
        }
        function stopAlarmSound() {
            document.getElementById('alarm-trigger-modal').classList.add('hidden');
            if(beepInterval) clearInterval(beepInterval);
        }
        function playBeep() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    </script>
</body>
